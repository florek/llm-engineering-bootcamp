const questions=[{"n": 1, "category": "LLM", "difficulty": "łatwe", "text": "Jak tokenizer zwykle traktuje bardzo popularne słowa w typowym zdaniu?", "options": {"A": "Często przypisuje każdemu z nich osobny, pojedynczy token", "B": "Zawsze rozbija je na pojedyncze litery", "C": "Zamienia je na token UNKNOWN", "D": "Pomija je w słowniku, bo są zbyt popularne"}, "correct": "A", "why": "Popularne słowa często mieszczą się w pojedynczym tokenie, bo fragment pojawia się często w danych tokenizera.", "lesson": {"correct": "Tokenizer lubi kawałki tekstu, które pojawiają się bardzo często. Popularne słowo często dostaje własny, gotowy token. Model nie musi wtedy składać go z liter. To oszczędza miejsce i ułatwia pracę. Typową pomyłką jest myślenie, że każde słowo zawsze rozpada się na litery.", "example": "Wyobraź sobie zdanie z prostymi angielskimi słowami: an, important, for, my, class. Wiele z nich może zostać osobnymi tokenami. Słowa są częste, więc tokenizer ma dla nich gotowe „cegiełki”. Rzadkie słowo w tym samym zdaniu mogłoby się już podzielić na części.", "remember": "Częste słowo → często jeden token.", "wrong": {"B": "Rozbijanie na litery to skrajność znakowa. Popularne słowa zwykle nie są cięte aż tak mocno.", "C": "UNKNOWN dotyczy głównie słowników opartych na całych nieznanych słowach, a nie typowego traktowania popularnych wyrazów.", "D": "Popularne słowa właśnie chętnie trafiają do słownika. Nie są pomijane za popularność."}}}, {"n": 2, "category": "API", "difficulty": "łatwe", "text": "Do czego służy wiadomość z rolą system w Chat Completions?", "options": {"A": "Do przechowywania klucza API w prompcie", "B": "Do pobierania treści strony WWW", "C": "Do reprezentowania poprzedniej odpowiedzi użytkownika", "D": "Do ustawienia globalnych reguł, tonu i formatu odpowiedzi"}, "correct": "D", "why": "Rola system ustawia globalne reguły zachowania, tonu i formatu odpowiedzi modelu.", "lesson": {"correct": "Wiadomość system mówi modelowi, jak ma się zachować. Może ustawić język, ton, format i ograniczenia. To reguły gry dla odpowiedzi. Wiadomość user zwykle przynosi konkretne zadanie albo dane. Typową pomyłką jest mylenie roli system z miejscem na sekrety techniczne.", "example": "System mówi: „Odpowiadaj po polsku, krótko i w punktach”. User wkleja artykuł i prosi o streszczenie. Model dostaje jednocześnie zasady i treść do pracy. Bez roli system reguły trzeba byłoby powtarzać przy każdym pytaniu.", "remember": "System ustawia zasady gry, user przynosi zadanie.", "wrong": {"A": "Klucz API służy do uwierzytelnienia klienta i nie powinien trafiać do promptu.", "B": "Pobieranie strony robi kod lub narzędzie przed wywołaniem modelu.", "C": "Pytanie użytkownika ma rolę user; poprzednia odpowiedź modelu to assistant."}}}, {"n": 3, "category": "LLM", "difficulty": "łatwe", "text": "Jaka jest orientacyjna reguła łącząca znaki z tokenami dla typowego tekstu angielskiego?", "options": {"A": "1 token ≈ 40 znaków", "B": "1 token ≈ 1 znak", "C": "1 token ≈ 4 znaki", "D": "1 token ≈ 100 znaków"}, "correct": "C", "why": "Orientacyjna reguła brzmi: 1 token ≈ 4 znaki — to tylko przybliżenie dla typowego tekstu.", "lesson": {"correct": "Ludzie lubią szybkie przeliczniki. Jedna prosta reguła mówi: około czterech znaków na token. To nie jest prawo fizyki. To przybliżenie do szybkiego szacowania. Najlepiej działa przy zwykłym tekście angielskim. Typową pomyłką jest traktowanie tej liczby jak dokładnego licznika.", "example": "Masz 4000 znaków. Orientacyjnie to około 1000 tokenów. Jeśli tekst jest kodem albo pełen rzadkich słów, wynik może być inny. Reguła pomaga „wyczuć” skalę, a nie zastępuje prawdziwego tokenizera.", "remember": "Na szybko: 1 token ≈ 4 znaki — tylko szacunek.", "wrong": {"A": "40 znaków na token byłoby dużo za rzadkim podziałem względem podanej reguły.", "B": "Jeden znak na token to podejście znakowe, nie orientacyjna reguła z materiału.", "D": "100 znaków na token mocno zawyża długość tokenu względem reguły ≈ 4 znaki."}}}, {"n": 4, "category": "Narzędzia", "difficulty": "łatwe", "text": "Na jakim porcie domyślnie nasłuchuje serwer Ollama?", "options": {"A": "8080", "B": "11434", "C": "3000", "D": "5000"}, "correct": "B", "why": "Serwer Ollama domyślnie nasłuchuje na porcie 11434.", "lesson": {"correct": "Ollama uruchamia lokalny serwer HTTP. Domyślny port to 11434. Na ten adres kierujesz klienta API albo sprawdzenie połączenia. To ważne przy pracy z lokalnym modelem. Typową pomyłką jest mylenie tego portu z popularnymi 3000 albo 8080.", "example": "Ustawiasz base_url na http://localhost:11434/v1. Jeśli serwer działa, klient może wysłać Chat Completions. Zły port da błąd połączenia nawet przy poprawnym prompcie.", "remember": "Ollama = lokalny serwer na 11434.", "wrong": {"A": "8080 bywa używany przez inne aplikacje, ale nie jest domyślnym portem Ollamy.", "C": "3000 często kojarzy się z frontendem developerskim, nie z Ollamą.", "D": "5000 też bywa portem innych usług; Ollama używa 11434."}}}, {"n": 5, "category": "LLM", "difficulty": "średnie", "text": "Dlaczego token często zawiera spację przed słowem?", "options": {"A": "Bo spacja może informować model, że zaczyna się nowe słowo", "B": "Bo tokenizer usuwa wszystkie spacje z tekstu", "C": "Bo spacja zawsze zajmuje osobny milionowy token ID", "D": "Bo modele nie potrafią przetwarzać znaków białych"}, "correct": "A", "why": "Spacja przed słowem może być częścią tokenu i niesie informację, że zaczyna się nowe słowo.", "lesson": {"correct": "Token nie zawsze to samo „słowo bez spacji”. Często wygląda jak spacja plus słowo. Ta spacja mówi: tu zaczyna się nowa jednostka. Dzięki temu tokenizer rozróżnia początek słowa i fragment w środku innego wyrazu. Typową pomyłką jest ignorowanie spacji jako „nieważnej ozdoby”.", "example": "Token „ important” to nie to samo co „important” w środku „unimportant”. Pierwszy sygnał mówi: nowe słowo. Drugi może być tylko środkowym kawałkiem. Mała spacja zmienia znaczenie tokenu.", "remember": "Spacja przed słowem bywa częścią tokenu i oznacza początek słowa.", "wrong": {"B": "Tokenizer nie usuwa wszystkich spacji; często je wchłania do tokenów.", "C": "Nie ma reguły, że spacja zawsze dostaje osobny „milionowy” ID. Często jest częścią tokenu ze słowem.", "D": "Modele przetwarzają spacje właśnie poprzez tokenizację; problem nie polega na braku obsługi."}}}, {"n": 6, "category": "LLM", "difficulty": "średnie", "text": "Czym token ID różni się od embeddingu?", "options": {"A": "Token ID jest wektorem, a embedding jest literą", "B": "Token ID zmienia wagi modelu przy każdym znaku, a embedding ich nie zmienia", "C": "Token ID to numer fragmentu tekstu, a embedding to późniejsza reprezentacja wektorowa", "D": "Token ID istnieje tylko w Ollamie, a embedding tylko w frontier"}, "correct": "C", "why": "Token ID to numer przypisany fragmentowi tekstu; embedding pojawia się później jako wektor.", "lesson": {"correct": "Najpierw tekst staje się tokenem. Potem dostaje numer: token ID. Dopiero później model zamienia numer na wektor liczb zwany embeddingiem. To trzy różne etapy. Typową pomyłką jest nazywanie samego numeru „wektorem”.", "example": "Fragment „cat” może dostać ID 12345. Embedding może wyglądać jak lista liczb: 0.12, -0.83, 0.44… Numer jest jak numer szafki. Wektor opisuje zawartość używaną przez sieć.", "remember": "Token = tekst, ID = numer, embedding = wektor.", "wrong": {"A": "Jest odwrotnie w praktyce: ID to numer, embedding to wektor.", "B": "Samo przypisanie ID nie jest treningiem wag modelu.", "D": "Rozróżnienie nie zależy od lokalnego czy frontier modelu."}}}, {"n": 7, "category": "LLM", "difficulty": "średnie", "text": "Jaką orientacyjną liczbę słów odpowiada około 1000 tokenom w typowym tekście angielskim?", "options": {"A": "100 słów", "B": "1000 słów", "C": "4000 słów", "D": "750 słów"}, "correct": "D", "why": "Reguła orientacyjna: 1 token ≈ 0,75 słowa, więc 1000 tokenów ≈ 750 słów.", "lesson": {"correct": "Druga popularna reguła mówi: jeden token to około trzech czwartych słowa. Dlatego tysiąc tokenów to mniej więcej 750 słów. To znów tylko szacunek. Najlepiej pasuje do zwykłego angielskiego. Typową pomyłką jest założenie „1 token = 1 słowo”.", "example": "Dostawca podaje cenę za milion tokenów. Przy regule 0,75 to około 750 000 słów. Dzięki temu „milion tokenów” nabiera ludzkiej skali. Dla kodu przelicznik może być gorszy.", "remember": "1000 tokenów ≈ 750 słów — tylko dla typowego angielskiego.", "wrong": {"A": "100 słów byłoby zbyt mało względem reguły 0,75 słowa na token.", "B": "1000 słów zakłada 1:1 token–słowo, a materiał podaje ≈ 0,75.", "C": "4000 słów mocno zawyża liczbę względem reguły orientacyjnej."}}}, {"n": 8, "category": "API", "difficulty": "średnie", "text": "Dlaczego dwa osobne wywołania Chat Completions nie tworzą pamięci rozmowy automatycznie?", "options": {"A": "Rola assistant usuwa wcześniejsze wiadomości", "B": "API jest bezstanowe i historię trzeba ponownie przesłać w messages", "C": "Tokenizer nie potrafi kodować dialogu", "D": "Pamięć działa wyłącznie z modelem reasoningowym"}, "correct": "B", "why": "API jest bezstanowe; historię trzeba ponownie przesłać w messages.", "lesson": {"correct": "Każde wywołanie zaczyna się od danych, które właśnie wysyłasz. Serwer nie pamięta poprzedniego żądania sam z siebie. Aplikacja buduje iluzję pamięci, dołączając historię do messages. Typową pomyłką jest przypisywanie pamięci samemu modelowi między wywołaniami.", "example": "Najpierw piszesz „Mam na imię Ed”. Potem wysyłasz tylko „Jak mam na imię?”. Bez wcześniejszej wiadomości w nowej liście model nie zobaczy imienia. Trzeba przesłać obie wiadomości razem.", "remember": "Nie wyślesz historii — model jej nie zobaczy.", "wrong": {"A": "Rola assistant pomaga odtworzyć wcześniejsze odpowiedzi modelu, a nie usuwa historii.", "C": "Tokenizer koduje dialog jak inny tekst; problem to brak historii w żądaniu.", "D": "Bezstanowość dotyczy wywołań API niezależnie od typu modelu."}}}, {"n": 9, "category": "LLM", "difficulty": "średnie", "text": "Co zwykle dzieje się z rzadkim albo mniej popularnym słowem podczas tokenizacji?", "options": {"A": "Zawsze staje się jednym tokenem o długości całego zdania", "B": "Zostaje całkowicie usunięte z wejścia", "C": "Często jest dzielone na kilka mniejszych tokenów", "D": "Automatycznie zwiększa limit kontekstu modelu"}, "correct": "C", "why": "Rzadkie słowa często rozpadają się na kilka mniejszych tokenów ze znanego słownika.", "lesson": {"correct": "Słownik tokenów jest ograniczony. Rzadkie słowo może nie mieć własnego wpisu. Tokenizer wtedy tnie je na mniejsze, częstsze fragmenty. Dzięki temu da się zapisać prawie dowolny tekst. Typową pomyłką jest wiara, że każde słowo zawsze dostaje jeden token.", "example": "Słowo „handcrafted” może rozpaść się na „hand” i „crafted”. Oba kawałki tokenizer już zna. Zmyślone słowo też da się złożyć z mniejszych części. Popularne „the” zwykle zostanie jednym tokenem.", "remember": "Rzadkie słowo → zwykle kilka mniejszych tokenów.", "wrong": {"A": "Token rzadko obejmuje całe zdanie; rzadkie słowo raczej się dzieli, nie rośnie do zdania.", "B": "Tekst nie jest usuwany — jest reprezentowany fragmentami.", "D": "Tokenizacja nie powiększa limitu kontekstu; może nawet zajmować więcej miejsca w limicie."}}}, {"n": 10, "category": "API", "difficulty": "średnie", "text": "Co oznacza nazwa Chat Completions w kontekście API?", "options": {"A": "Dostajesz historię rozmowy i prosisz model o dokończenie — przewidzenie kolejnej wiadomości asystenta", "B": "Model kończy trening parametrów po każdej wiadomości", "C": "Klient musi wysłać wyłącznie pustą listę messages", "D": "API zwraca tylko listę token ID bez tekstu"}, "correct": "A", "why": "Chat Completions oznacza: podajesz historię rozmowy i prosisz o przewidzenie kolejnej wiadomości asystenta.", "lesson": {"correct": "API nie „rozmawia” magicznie samo z siebie. Dostaje listę wiadomości. Ma przewidzieć, co powinien powiedzieć asystent dalej. To nadal predykcja kolejnych tokenów, tylko w formie czatu. Typową pomyłką jest myślenie, że nazwa oznacza trening albo lokalne dopisywanie wag.", "example": "Wysyłasz system i user. Model generuje odpowiedź assistant. Jeśli dodasz tę odpowiedź i kolejne pytanie, prosisz o następne dokończenie rozmowy. Każde wywołanie to nowa prośba o kontynuację.", "remember": "Chat Completions = dokończ rozmowę kolejną wiadomością asystenta.", "wrong": {"B": "Wywołanie inference nie kończy ani nie uruchamia treningu parametrów.", "C": "Lista messages właśnie niesie treść rozmowy; nie powinna być pusta bez powodu.", "D": "Odpowiedź API zawiera treść wiadomości asystenta, nie tylko surowe ID."}}}, {"n": 11, "category": "LLM", "difficulty": "trudne", "text": "Dlaczego token reprezentujący początek słowa może różnić się od tokenu tego samego ciągu liter wewnątrz innego słowa?", "options": {"A": "Bo tokenizer zawsze łączy całe zdanie w jeden token", "B": "Bo embeddingi kasują różnicę między spacjami a literami", "C": "Bo modele lokalne nie używają tokenów początku słowa", "D": "Bo spacja lub sygnał początku słowa może tworzyć inny token niż ten sam fragment w środku wyrazu"}, "correct": "D", "why": "Token początku słowa (często ze spacją) może być inny niż ten sam fragment użyty wewnątrz innego słowa.", "lesson": {"correct": "Te same litery nie zawsze oznaczają ten sam token. Na początku słowa tokenizer często widzi sygnał „tu startuje słowo”. W środku dłuższego wyrazu ten sam ciąg liter może być innym kawałkiem. Dlatego „ important” i „important” w „unimportant” to nie musi być to samo. Typową pomyłką jest porównywanie tokenów tylko po literach bez kontekstu pozycji.", "example": "Weź „important” samodzielnie i „unimportant”. Pierwsze może dostać token ze spacją na początku. Drugie może pójść jako „un” + „important” bez tego sygnału początku. Literki wyglądają podobnie, tokeny mogą być inne.", "remember": "Ten sam napis na starcie słowa ≠ automatycznie ten sam token w środku słowa.", "wrong": {"A": "Tokenizer dzieli tekst na wiele tokenów; nie scala całego zdania w jeden.", "B": "Embeddingi pojawiają się później; nie tłumaczą różnicy tokenów początku słowa.", "C": "Rozróżnienie dotyczy tokenizacji ogólnie, nie tylko modeli lokalnych."}}}, {"n": 12, "category": "LLM", "difficulty": "trudne", "text": "Jaki jest główny problem podejścia „znak po znaku” dla sieci neuronowej?", "options": {"A": "Słownik znaków jest zbyt duży, by zmieścić litery", "B": "Model musi sam składać znaki w jednostki, rozpoznawać słowa i przypisywać im znaczenie", "C": "Znakowe wejście uniemożliwia użycie jakiegokolwiek API", "D": "Każdy znak musi mieć embedding o długości miliona liczb"}, "correct": "B", "why": "Przy znakach sieć musi sama składać litery, rozpoznawać słowa i przypisywać znaczenie.", "lesson": {"correct": "Podejście znakowe ma mały słownik, więc wygląda prosto. Ale sieć dostaje same literki. Musi sama zauważyć, że k + o + t tworzy „kot”. Potem musi jeszcze nauczyć się znaczenia. To zostawia bardzo dużo pracy modelowi. Typową pomyłką jest myślenie, że mały słownik zawsze oznacza łatwiejsze uczenie.", "example": "Dla słowa „kot” wejście to trzy osobne znaki. Model najpierw składa je w całość. Dopiero później uczy się znaczenia. Przy tokenach często dostaje większy kawałek od razu.", "remember": "Mały słownik znaków = dużo pracy składania dla sieci.", "wrong": {"A": "Słownik znaków jest właśnie mały i ograniczony — to zaleta, nie główny problem.", "C": "Problem nie dotyczy zakazu API; chodzi o ilość pracy przy składaniu znaczenia.", "D": "Notatki nie wymagają embeddingu o długości miliona dla każdego znaku."}}}, {"n": 13, "category": "LLM", "difficulty": "trudne", "text": "Dlaczego kod źródłowy często zużywa więcej tokenów niż zwykły tekst o podobnej długości znakowej?", "options": {"A": "Bo zawiera nazwy zmiennych, symbole, nawiasy i nietypowe ciągi, które tokenizują się mniej „gęsto”", "B": "Bo tokenizer zawsze zamienia kod na jeden token UNKNOWN", "C": "Bo kod nie może być tokenizowany w żadnym modelu", "D": "Bo każde słowo w kodzie musi zajmować dokładnie 100 tokenów"}, "correct": "A", "why": "Kod ma symbole, nazwy i nietypowe ciągi, więc bywa tokenizowany mniej gęsto niż zwykły tekst.", "lesson": {"correct": "Zwykły angielski tekst ma dużo częstych słów. Kod jest pełen podkreśleń, nawiasów, operatorów i dziwnych nazw. Te elementy rzadziej tworzą długie, „tanie” tokeny. Dlatego przy tej samej liczbie znaków kod może zająć więcej tokenów. Typową pomyłką jest stosowanie reguły 4 znaków na token także do kodu bez sprawdzenia.", "example": "Nazwa customer_invoice_total_v2 może rozpaść się na wiele kawałków. W zwykłym zdaniu podobna liczba znaków mogłaby dać mniej tokenów. Dlatego budżet kontekstu na kod bywa szybciej zjadany.", "remember": "Kod często jest „droższy” tokenowo niż zwykły tekst.", "wrong": {"B": "Kod jest dzielony na tokeny, a nie masowo zamieniany na UNKNOWN.", "C": "Kod jak najbardziej bywa tokenizowany; problem dotyczy kosztów i gęstości.", "D": "Nie ma stałej reguły „100 tokenów na słowo w kodzie”."}}}, {"n": 14, "category": "LLM", "difficulty": "średnie", "text": "Jaką rolę pełni router w modelu Mixture of Experts?", "options": {"A": "Zmienia prompt użytkownika na tokeny", "B": "Przechowuje wszystkie dane treningowe", "C": "Wybiera ekspertów używanych dla danego wejścia", "D": "Uruchamia zawsze wszystkich ekspertów naraz"}, "correct": "C", "why": "Router wybiera ekspertów używanych dla danego wejścia.", "lesson": {"correct": "Model MoE ma wiele wyspecjalizowanych części zwanych ekspertami. Router decyduje, którzy eksperci mają pracować przy danym wejściu. Reszta nie musi liczyć w tym kroku. Dzięki temu duży model może używać tylko części parametrów. Typową pomyłką jest założenie, że zawsze włączają się wszyscy.", "example": "Recepcja nie wysyła pacjenta do wszystkich lekarzy naraz. Kieruje go do pasujących specjalistów. Router działa podobnie: wybiera drogę do potrzebnych ekspertów.", "remember": "Router wybiera ekspertów, zamiast włączać wszystkich.", "wrong": {"A": "Zamiana tekstu na tokeny to zadanie tokenizera, nie routera MoE.", "B": "Router nie jest bazą danych treningowych.", "D": "Sens MoE polega na tym, że nie wszyscy eksperci muszą działać naraz."}}}, {"n": 15, "category": "LLM", "difficulty": "łatwe", "text": "Jak tokenizer może potraktować długą liczbę, na przykład ciąg cyfr π?", "options": {"A": "Zawsze zostawia ją jako jeden niewidzialny token poza kontekstem", "B": "Może podzielić ją na mniejsze fragmenty obejmujące kilka cyfr", "C": "Zamienia każdą liczbę na dokładnie jedno słowo angielskie", "D": "Odrzuca wszystkie cyfry przed wejściem do modelu"}, "correct": "B", "why": "Długie liczby mogą być dzielone na mniejsze tokeny; model nie zawsze widzi całą liczbę jako jedną jednostkę.", "lesson": {"correct": "Liczby też przechodzą przez tokenizację. Długa sekwencja cyfr może zostać pocięta na kawałki. Model wtedy „widzi” liczbę jako kilka części, nie jedną bryłę. To wpływa na zadania matematyczne. Typową pomyłką jest założenie, że każda liczba to zawsze jeden token.", "example": "Liczba 3.1415926535897793 może rozpaść się na kilka fragmentów. Podobnie długi ciąg 123456789 może stać się wieloma tokenami. Starsze modele miały przez to trudniej z większymi liczbami.", "remember": "Długa liczba ≠ automatycznie jeden token.", "wrong": {"A": "Liczba trafia do wejścia jako tokeny, nie znika jako „niewidzialny” token poza kontekstem.", "C": "Tokenizer nie zamienia cyfr na angielskie słowa jako regułę.", "D": "Cyfry nie są odrzucane; są kodowane tokenami."}}}, {"n": 16, "category": "Narzędzia", "difficulty": "łatwe", "text": "Do czego służy encode w bibliotece tiktoken?", "options": {"A": "Do trenowania nowego modelu od zera", "B": "Do pobierania strony WWW bez HTML", "C": "Do uruchamiania lokalnego serwera Ollama", "D": "Do zamiany tekstu na listę identyfikatorów tokenów"}, "correct": "D", "why": "encode zamienia tekst na listę identyfikatorów tokenów — reprezentację, którą „widzi” model.", "lesson": {"correct": "tiktoken pozwala zobaczyć tokenizację bez wywoływania API. encode bierze tekst i zwraca listę numerów. decode robi odwrotnie: z numerów odtwarza tekst. To narzędzie do intuicji i liczenia. Typową pomyłką jest mylenie encode z treningiem modelu.", "example": "Bierzesz zdanie „Hi my name is Ed…”. encode daje listę ID. Potem dla każdego ID robisz decode i widzisz, jaki kawałek tekstu mu odpowiada. Czasem ze spacją, czasem bez.", "remember": "encode: tekst → lista token ID.", "wrong": {"A": "tiktoken nie trenuje modelu; tylko koduje tekst.", "B": "Pobieranie stron to scraper, nie encode.", "C": "Serwer Ollama uruchamia się osobno; encode tego nie robi."}}}, {"n": 17, "category": "LLM", "difficulty": "średnie", "text": "Dla jakiego rodzaju treści orientacyjne reguły „1 token ≈ 4 znaki” i „1 token ≈ 0,75 słowa” działają najlepiej?", "options": {"A": "Dla typowego tekstu w języku angielskim", "B": "Wyłącznie dla kodu źródłowego z wieloma symbolami", "C": "Wyłącznie dla wzorów matematycznych i terminologii naukowej", "D": "Dla każdego języka i każdej formy tekstu z tą samą dokładnością"}, "correct": "A", "why": "Przybliżenia najlepiej sprawdzają się dla typowego tekstu angielskiego; gorzej dla kodu, matematyki, rarów i innych języków.", "lesson": {"correct": "Reguły orientacyjne powstały głównie wokół zwykłego angielskiego. Tam częste słowa i typowa składnia dają przewidywalniejszą gęstość. Kod, wzory, rzadkie nazwy i inne języki mogą zużywać tokeny inaczej. Dlatego reguła to kompas, nie linijka. Typową pomyłką jest stosowanie jej wszędzie jak stałej fizycznej.", "example": "Esej po angielsku: 4000 znaków ≈ 1000 tokenów wygląda sensownie. Ten sam rozmiar w kodzie z długimi nazwami zmiennych może dać więcej tokenów. Tekst naukowy ze wzorami też bywa droższy.", "remember": "Reguły tokenowe: najlepsze dla zwykłego angielskiego, ostrożnie gdzie indziej.", "wrong": {"B": "Kod właśnie często psuje te przybliżenia, bo tokenizuje się mniej gęsto.", "C": "Matematyka i terminologia naukowa też bywają droższe tokenowo — to nie „najlepszy” przypadek reguł.", "D": "Materiał podkreśla, że reguły nie działają równie dobrze dla każdej formy i języka."}}}, {"n": 18, "category": "LLM", "difficulty": "trudne", "text": "Które zdanie najtrafniej odróżnia RAG od uczenia parametrów?", "options": {"A": "RAG zmienia wagi modelu przy każdym pobranym dokumencie", "B": "RAG zastępuje inferencję wyszukiwarką i nie używa LLM", "C": "RAG dostarcza informacje w kontekście bez konieczności zapisywania ich w wagach", "D": "RAG zwiększa liczbę ekspertów aktywnych w modelu MoE"}, "correct": "C", "why": "RAG dostarcza informacje w kontekście bez konieczności zapisywania ich w wagach.", "lesson": {"correct": "RAG najpierw wyszukuje potrzebne informacje. Potem wkłada je do kontekstu gotowego modelu. Model odpowiada na podstawie pytania i znalezionych treści. Nie musi przy tym zapisywać dokumentu w swoich wagach. Typową pomyłką jest mylenie chwilowego kontekstu z treningiem.", "example": "Użytkownik pyta o dzisiejszy regulamin. System znajduje fragment i dołącza go do promptu. Model korzysta z niego teraz. Po wywołaniu regulamin nie staje się trwałym parametrem modelu.", "remember": "RAG podaje ściągę na biurko, a nie przepisuje wag modelu.", "wrong": {"A": "Pobrany dokument trafia do kontekstu, a nie automatycznie do wag.", "B": "Wyszukiwarka dostarcza materiał, ale LLM nadal generuje odpowiedź.", "D": "RAG nie steruje ekspertami MoE; dostarcza informacje zewnętrzne."}}}, {"n": 19, "category": "LLM", "difficulty": "trudne", "text": "Dlaczego porównanie „1 000 000 tokenów ≈ 750 000 słów” pomaga przy cenach API?", "options": {"A": "Bo każdy dostawca zawsze rozlicza wyłącznie znaki, nigdy tokeny", "B": "Bo ceny często podaje się za milion tokenów, a reguła daje intuicję, ile to mniej więcej tekstu", "C": "Bo milion tokenów zawsze równa się dokładnie jednemu słowu", "D": "Bo reguła gwarantuje, że kod i angielski esej kosztują tyle samo"}, "correct": "B", "why": "Dostawcy często wyceniają milion tokenów; reguła 0,75 słowa na token buduje intuicję, ile tekstu to oznacza.", "lesson": {"correct": "Cenniki API lubią jednostkę „za milion tokenów”. Samo słowo „milion” mało mówi o objętości tekstu. Reguła 0,75 słowa na token zamienia to na około 750 000 słów. Dzięki temu łatwiej wyobrazić sobie skalę. Typową pomyłką jest traktowanie tej liczby jako gwarancji dla kodu i każdego języka.", "example": "W materiale porównano to do dzieł Szekspira: około 900 000 słów ≈ około 1,2 miliona tokenów według reguły. Widzisz wtedy, że „milion tokenów” to naprawdę dużo książkowego tekstu, ale nadal tylko orientacyjnie.", "remember": "Cena za 1M tokenów + reguła 0,75 = intuicja „ile to słów”.", "wrong": {"A": "Rozliczenie zwykle idzie per token, nie per znak.", "C": "Milion tokenów to setki tysięcy słów według reguły, nie jedno słowo.", "D": "Reguła nie wyrównuje kosztów kodu i eseju; kod bywa droższy tokenowo."}}}, {"n": 20, "category": "Agentic AI", "difficulty": "trudne", "text": "Co technicznie oznacza autonomia agenta opartego na LLM?", "options": {"A": "Model uzyskuje własną wolę i działa poza systemem", "B": "Jedno wywołanie modelu zawsze kończy całe wieloetapowe zadanie", "C": "Agent nie potrzebuje kontekstu ani narzędzi", "D": "Model wybiera następny krok, system wykonuje narzędzie, a wynik wraca do kolejnego wywołania"}, "correct": "D", "why": "Autonomia agenta to pętla: decyzja modelu, wykonanie narzędzia, wynik wraca do kolejnego wywołania.", "lesson": {"correct": "Agent używa LLM jako elementu sterującego workflow. Model wskazuje kolejny krok. System wykonuje narzędzie. Wynik wraca do modelu jako nowy kontekst. To pętla decyzji i działań. Typową pomyłką jest przypisywanie temu „własnej woli”.", "example": "Użytkownik prosi o rezerwację restauracji. Model wybiera wyszukiwarkę, potem sprawdzenie terminów, potem funkcję rezerwacji. Po każdym kroku wynik wraca i model decyduje dalej.", "remember": "Agent = decyzja, narzędzie, wynik, kolejna decyzja.", "wrong": {"A": "Autonomia jest tu pojęciem technicznym, nie świadomością ani wolną wolą.", "B": "Wieloetapowe zadanie zwykle wymaga kilku wywołań i wyników narzędzi.", "C": "Kontekst i narzędzia są kluczowymi elementami systemu agentowego."}}}];
const quiz=document.querySelector("#quiz");
const letters=["A","B","C","D"];
const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
questions.forEach(question=>{
const article=document.createElement("article");
article.className="question";
article.id=`question-${question.n}`;
const options=letters.map(letter=>`<label class="option"><input type="radio" name="q${question.n}" value="${letter}"><strong>${letter}.</strong><span>${escapeHtml(question.options[letter])}</span></label>`).join("");
article.innerHTML=`<div class="meta"><span class="tag">${escapeHtml(question.category)}</span><span class="tag difficulty">${escapeHtml(question.difficulty)}</span></div><h2>${question.n}. ${escapeHtml(question.text)}</h2><div class="options">${options}<label class="option unknown"><input type="radio" name="q${question.n}" value="?"><strong>?</strong><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="confidence${question.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" aria-live="polite"></div>`;
quiz.appendChild(article);
});
let lastResults=null;
const selectedAnswer=n=>document.querySelector(`input[name="q${n}"]:checked`)?.value||"";
const confidence=n=>document.querySelector(`select[name="confidence${n}"]`).value;
const lessonBlock=(question,chosen)=>{
const wrong=chosen==="?"?"":`<div class="lesson-part"><strong>Twoja odpowiedź</strong>${escapeHtml(question.lesson.wrong[chosen])}</div>`;
const intro=chosen==="?"?"<p>Bez zgadywania — oto spokojne wyjaśnienie.</p>":"";
return `${intro}${wrong}<div class="lesson-part"><strong>Poprawna myśl</strong>${escapeHtml(question.lesson.correct)}</div><div class="lesson-part"><strong>Przykład</strong>${escapeHtml(question.lesson.example)}</div><div class="lesson-part"><strong>Zapamiętaj</strong>${escapeHtml(question.lesson.remember)}</div>`;
};
document.querySelector("#check").addEventListener("click",()=>{
const missing=questions.filter(question=>!selectedAnswer(question.n));
document.querySelectorAll(".question").forEach(element=>element.classList.remove("missing"));
if(missing.length){
missing.forEach(question=>document.querySelector(`#question-${question.n}`).classList.add("missing"));
document.querySelector(`#question-${missing[0].n}`).scrollIntoView({behavior:"smooth",block:"center"});
alert(`Uzupełnij odpowiedź A–D albo „Nie mam pojęcia” w ${missing.length} pytaniach.`);
return;
}
let score=0;
let unknown=0;
lastResults=questions.map(question=>{
const chosen=selectedAnswer(question.n);
const feedback=document.querySelector(`#question-${question.n} .feedback`);
feedback.className="feedback show";
if(chosen===question.correct){
score++;
feedback.classList.add("ok");
feedback.innerHTML=`<h3>OK · ${question.correct}</h3><p>${escapeHtml(question.why)}</p>`;
return{question,chosen,status:"OK",confidence:confidence(question.n)};
}
if(chosen==="?"){
unknown++;
feedback.classList.add("learn");
feedback.innerHTML=`<h3>NIE WIEM · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"NIE WIEM",confidence:confidence(question.n)};
}
feedback.classList.add("bad");
feedback.innerHTML=`<h3>BŁĄD · Twoja: ${chosen} · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"BŁĄD",confidence:confidence(question.n)};
});
const percent=Math.round(score/questions.length*100);
const summary=document.querySelector("#summary");
summary.className="show";
summary.innerHTML=`<strong>Wynik: ${score}/20 · ${percent}%</strong><br>Nie wiem: ${unknown}<p class="small">Przeczytaj krótkie wyjaśnienia oraz mini-lekcje pod pytaniami oznaczonymi BŁĄD lub NIE WIEM.</p>`;
document.querySelector("#downloadResults").disabled=false;
summary.scrollIntoView({behavior:"smooth",block:"start"});
});
const tableRow=result=>`| ${result.question.n} | ${result.chosen||""} | ${result.confidence||""} |  |`;
const download=(filename,content)=>{
const blob=new Blob([content],{type:"text/markdown;charset=utf-8"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=filename;
link.click();
URL.revokeObjectURL(link.href);
};
document.querySelector("#downloadAnswers").addEventListener("click",()=>{
const rows=questions.map(question=>tableRow({question,chosen:selectedAnswer(question.n),confidence:confidence(question.n)})).join("\n");
download("29.09.2026_my_answers.md",`# Moje odpowiedzi – 29.09.2026\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---:|:---:|:---:|---|\n${rows}\n\n## Notatki\n`);
});
document.querySelector("#downloadResults").addEventListener("click",()=>{
if(!lastResults)return;
const score=lastResults.filter(result=>result.status==="OK").length;
const unknown=lastResults.filter(result=>result.status==="NIE WIEM").length;
const percent=Math.round(score/questions.length*100);
const detail=lastResults.map(result=>`| ${result.question.n} | ${result.chosen} | ${result.question.correct} | ${result.status} | ${result.confidence||""} | ${result.question.why.replace(/\|/g,"\\|")} |`).join("\n");
const strong=[...new Set(lastResults.filter(result=>result.status==="OK").map(result=>result.question.category))];
const repeat=[...new Set(lastResults.filter(result=>result.status!=="OK").map(result=>result.question.category))];
const strongText=strong.length?strong.map(value=>`- ${value}`).join("\n"):"- Brak kategorii z poprawną odpowiedzią.";
const repeatText=repeat.length?repeat.map(value=>`- ${value}`).join("\n"):"- Brak obszarów do powtórki.";
download("29.09.2026_results.md",`# Wynik quizu — 29.09.2026\n\n## Wynik\n\n- ${score}/20\n- ${percent}%\n- Nie wiem: ${unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---:|:---:|:---:|:---:|:---:|---|\n${detail}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${repeatText}\n`);
});
</script>
