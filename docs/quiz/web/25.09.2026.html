<script>
const questions=[
{n:1,category:"LLM",difficulty:"łatwe",text:"Czym są parametry modelu językowego?",options:{A:"Osobnymi rekordami, z których każdy przechowuje jeden fakt",B:"Liczbami uczonymi podczas treningu, które wspólnie reprezentują wzorce",C:"Tokenami znajdującymi się aktualnie w oknie kontekstu",D:"Instrukcjami zapisanymi przez użytkownika w prompcie"},correct:"B",why:"Parametry są liczbami uczonymi podczas treningu. Wiedza i wzorce są rozproszone między wieloma parametrami, a nie zapisane według zasady „jeden parametr = jeden fakt”.",lesson:{correct:"Parametry to liczby ustawiane podczas treningu modelu. Działają razem jak ogromny zestaw pokręteł. Wzorce języka są rozłożone pomiędzy wiele takich liczb. Typową pomyłką jest wyobrażenie sobie osobnej szufladki na każdy fakt.",example:"Wyobraź sobie tablicę z milionami małych pokręteł. Jedno pokrętło nie oznacza „Warszawa jest stolicą Polski”. Dopiero wspólne ustawienie bardzo wielu pokręteł wpływa na to, jakie tokeny model uzna za prawdopodobne.",remember:"Parametr to pokrętło we wspólnej maszynie, nie pojedyncza karteczka z faktem.",wrong:{A:"Ta odpowiedź myli parametr z rekordem bazy danych. Wiedza modelu jest rozproszona i nie ma prostego przypisania jednego faktu do jednej liczby.",C:"Token jest elementem tekstu na wejściu lub wyjściu, a parametr jest wyuczoną wartością wewnątrz modelu. To dwie różne rzeczy.",D:"Prompt dostarcza bieżące instrukcje i kontekst. Nie jest jednak zbiorem wartości wyuczonych podczas treningu."}}},
{n:2,category:"LLM",difficulty:"średnie",text:"Jaka jest główna intuicja Chinchilla scaling laws?",options:{A:"Każdy wzrost liczby parametrów zawsze poprawia model",B:"Dane treningowe można zastąpić dłuższym reasoningiem",C:"Najlepszy model powinien aktywować wszystkie parametry naraz",D:"Rozmiar modelu trzeba równoważyć ilością danych i dostępnych obliczeń"},correct:"D",why:"Chinchilla scaling laws podkreślają równowagę między rozmiarem modelu, ilością danych i dostępnymi obliczeniami. Samo dodawanie parametrów nie gwarantuje wykorzystania ich potencjału.",lesson:{correct:"Prawo skalowania mówi o dopasowaniu trzech rzeczy: rozmiaru modelu, danych i obliczeń. Wielki model potrzebuje odpowiednio dużo materiału do nauki. Potrzebuje też czasu i mocy, aby ten materiał przetworzyć. Typowa pomyłka to powiększanie samego modelu i oczekiwanie automatycznej poprawy.",example:"Wyobraź sobie ogromnego ucznia z tysiącem zeszytów, ale tylko jedną stroną materiału. Dodatkowe zeszyty pozostaną prawie puste. Lepszy wynik da rozsądna liczba zeszytów, dużo dobrych ćwiczeń i wystarczająco dużo czasu na naukę.",remember:"Model, dane i obliczenia muszą rosnąć w równowadze.",wrong:{A:"Więcej parametrów zwiększa pojemność, ale nie gwarantuje jakości. Bez odpowiednich danych i obliczeń potencjał może zostać niewykorzystany.",B:"Reasoning działa podczas odpowiadania gotowego modelu. Nie zastępuje danych potrzebnych do wyuczenia jego parametrów.",C:"Aktywowanie parametrów dotyczy sposobu inferencji, szczególnie modeli MoE. Nie jest główną intuicją Chinchilla scaling laws."}}},
{n:3,category:"LLM",difficulty:"łatwe",text:"Które działanie jest przykładem training-time scaling?",options:{A:"Zwiększenie liczby danych i obliczeń użytych do uczenia modelu",B:"Dołączenie wyszukanych dokumentów do promptu",C:"Kilkukrotne wywołanie gotowego modelu",D:"Pozwolenie modelowi dłużej analizować jedno pytanie"},correct:"A",why:"Training-time scaling zwiększa zasoby używane podczas uczenia, takie jak dane, parametry, GPU i czas treningu. Pozostałe opcje dotyczą pracy gotowego modelu.",lesson:{correct:"Training-time scaling dzieje się wtedy, gdy model jest uczony. Można użyć większej ilości danych, parametrów, GPU albo czasu. Po zakończeniu tego procesu powstaje gotowy model. Typowa pomyłka to zaliczanie do treningu wszystkiego, co poprawia odpowiedź.",example:"Zespół trenuje model przez 20 dni zamiast 10 i daje mu dwa razy więcej danych. To inwestycja przed udostępnieniem modelu użytkownikom. Dodanie dokumentu do pojedynczego promptu wydarzyłoby się już później, podczas użycia.",remember:"Training-time oznacza: więcej pracy przed powstaniem gotowego modelu.",wrong:{B:"Dokument dołączony do promptu zmienia bieżący kontekst, a nie wyuczone wagi. To praca podczas inferencji.",C:"Wiele wywołań korzysta z już wytrenowanego modelu. Nie zwiększa zasobów użytych do jego treningu.",D:"Dłuższa analiza jednego pytania jest reasoningiem podczas inferencji. Parametry modelu pozostają bez zmian."}}},
{n:4,category:"LLM",difficulty:"średnie",text:"Dlaczego reasoning zalicza się do inference-time scaling?",options:{A:"Powiększa zbiór danych treningowych po każdym pytaniu",B:"Trwale dopisuje nowe fakty do parametrów",C:"Zwiększa pracę gotowego modelu podczas tworzenia odpowiedzi",D:"Zawsze uruchamia większy wariant modelu"},correct:"C",why:"Reasoning daje gotowemu modelowi więcej czasu lub obliczeń podczas tworzenia odpowiedzi. Nie zmienia przy tym liczby wyuczonych parametrów.",lesson:{correct:"Reasoning odbywa się po zakończeniu treningu. Gotowy model wykonuje więcej kroków, zanim poda finalną odpowiedź. Większy wysiłek dotyczy konkretnego użycia modelu. Typową pomyłką jest uznanie tych kroków za dalsze uczenie wag.",example:"Model może od razu zgadnąć wynik zadania albo najpierw przeanalizować warunki, sprawdzić rozwiązanie i dopiero odpowiedzieć. Druga wersja zużywa więcej pracy podczas jednego wywołania. Model po odpowiedzi ma jednak te same parametry co wcześniej.",remember:"Reasoning wydłuża myślenie teraz, ale nie przepisuje wag na przyszłość.",wrong:{A:"Zbiór treningowy nie rośnie automatycznie po pytaniu użytkownika. Reasoning korzysta z gotowego modelu.",B:"Dodatkowe kroki analizy nie zapisują nowych faktów w parametrach. Są częścią bieżącego procesu generowania.",D:"Reasoning nie wymaga przełączenia na większy model. Ten sam gotowy model może dostać więcej czasu i obliczeń."}}},
{n:5,category:"LLM",difficulty:"trudne",text:"System pobiera aktualne ceny biletów, dodaje je do pytania i pozwala gotowemu modelowi wykonać kilka kroków analizy. Co najlepiej opisuje tę sytuację?",options:{A:"Wyłącznie training-time scaling, bo system otrzymał nowe dane",B:"Fine-tuning, ponieważ odpowiedź opiera się na cenach",C:"Połączenie RAG i reasoning jako technik pracy podczas inferencji",D:"Zwiększenie liczby parametrów aktywnych w każdej warstwie"},correct:"C",why:"Pobranie aktualnych danych i dodanie ich do kontekstu odpowiada idei RAG, a wieloetapowa analiza jest reasoningiem. Oba mechanizmy działają podczas inferencji.",lesson:{correct:"RAG dostarcza modelowi potrzebne informacje z zewnątrz. Reasoning daje mu więcej pracy na przeanalizowanie tych informacji. Oba mechanizmy działają, gdy gotowy model odpowiada. Typową pomyłką jest nazywanie każdej pracy z nowymi danymi treningiem.",example:"Klient pyta dziś o lot do Londynu. System wyszukuje cenę 450 zł i wkłada ją do kontekstu. Model porównuje dwa terminy, sprawdza warunek budżetu i odpowiada, ale jego wagi się nie zmieniają.",remember:"RAG przynosi fakty, reasoning je spokojnie obrabia.",wrong:{A:"Nowe dane w kontekście nie stają się danymi treningowymi. Model używa ich tylko podczas bieżącej inferencji.",B:"Fine-tuning zmieniałby wagi modelu w osobnym procesie uczenia. Samo przekazanie cen do promptu tego nie robi.",D:"Opis nie mówi o aktywowaniu większej liczby parametrów. Dotyczy wyszukania danych i dodatkowych kroków analizy."}}},
{n:6,category:"LLM",difficulty:"średnie",text:"Na osi logarytmicznej oznaczonej 1B, 10B, 100B i 1000B każdy kolejny krok oznacza:",options:{A:"wartość dziesięć razy większą",B:"dokładnie miliard parametrów więcej",C:"podwojenie liczby parametrów",D:"taki sam przyrost liniowy o 10B"},correct:"A",why:"Na skali logarytmicznej kolejne wartości 1B, 10B, 100B i 1000B różnią się dziesięciokrotnie. Równe odległości nie oznaczają równych przyrostów liniowych.",lesson:{correct:"Skala logarytmiczna pokazuje ilorazy, a nie równe różnice. W tym przykładzie każdy krok mnoży wartość przez dziesięć. Dlatego 1B, 10B i 100B mogą leżeć w równych odstępach. Typowa pomyłka to czytanie takiej osi jak zwykłej linijki.",example:"Od 1B do 10B przybywa 9B. Od 10B do 100B przybywa aż 90B. Mimo różnych przyrostów oba przejścia oznaczają mnożenie przez 10 i mogą wyglądać tak samo szeroko.",remember:"Na osi logarytmicznej pytaj „ile razy?”, nie „o ile?”.",wrong:{B:"Tylko pierwszy zapis zaczyna się od 1B, ale różnice nie wynoszą stale miliarda. Między 100B i 1000B jest 900B.",C:"Podwojenie dałoby 1B, 2B, 4B i 8B. Tutaj wartości rosną dziesięciokrotnie.",D:"Przyrost nie jest stały i nie wynosi 10B. Stały jest mnożnik równy dziesięć."}}},
{n:7,category:"LLM",difficulty:"łatwe",text:"Jaką rolę pełni router w modelu Mixture of Experts?",options:{A:"Zmienia prompt użytkownika na tokeny",B:"Przechowuje wszystkie dane treningowe",C:"Uruchamia zawsze wszystkich ekspertów",D:"Wybiera ekspertów używanych dla danego wejścia"},correct:"D",why:"Router kieruje wejście do wybranych ekspertów. Dzięki temu nie wszystkie części modelu muszą pracować przy każdym kroku.",lesson:{correct:"Model MoE składa się z wielu wyspecjalizowanych części nazywanych ekspertami. Router decyduje, które z nich wykorzystać dla danego wejścia. Pozostałe nie muszą pracować w tym kroku. Typową pomyłką jest założenie, że cały wielki model zawsze wykonuje wszystkie obliczenia.",example:"Wyobraź sobie recepcję w dużej przychodni. Recepcjonista nie wysyła pacjenta do wszystkich lekarzy naraz. Kieruje go do dwóch specjalistów, którzy pasują do jego problemu.",remember:"Router wybiera drogę do ekspertów, zamiast włączać wszystkich.",wrong:{A:"Zamiana tekstu na tokeny jest zadaniem tokenizera. Router MoE wybiera fragmenty modelu do obliczeń.",B:"Dane treningowe nie są przechowywane przez router jako baza rekordów. Router podejmuje decyzję o aktywacji ekspertów.",C:"Sens MoE polega właśnie na tym, że nie wszyscy eksperci muszą działać naraz. Router wybiera tylko potrzebnych."}}},
{n:8,category:"LLM",difficulty:"trudne",text:"Model MoE ma bardzo dużo parametrów całkowitych, ale przy generowaniu tokenu wykorzystuje tylko wybrane moduły. Jaki wniosek jest poprawny?",options:{A:"Parametry nieużywane w tym kroku zostają usunięte z modelu",B:"Liczba parametrów aktywnych może być mniejsza od liczby całkowitej",C:"Model wykonuje training-time scaling podczas każdego tokenu",D:"Każdy ekspert zawiera dokładnie tę samą wiedzę"},correct:"B",why:"Total parameters opisują cały model, a active parameters tylko część używaną w danym kroku inferencji. W MoE liczba aktywna może być znacznie mniejsza od całkowitej.",lesson:{correct:"Parametry całkowite obejmują wszystkie części modelu. Parametry aktywne obejmują tylko części pracujące przy danym kroku. W MoE router może uruchomić wybranych ekspertów, więc te liczby są różne. Typową pomyłką jest utożsamienie wielkości całego modelu z kosztem każdego pojedynczego obliczenia.",example:"Budynek ma 100 pracowników, lecz przy jednym zleceniu pracuje 20 wybranych osób. Firma nadal zatrudnia 100 osób. Dla tego zlecenia aktywna jest jednak tylko grupa 20.",remember:"Całość mówi, co model ma; aktywność mówi, czego używa teraz.",wrong:{A:"Nieużywane parametry nadal należą do modelu. Po prostu nie uczestniczą w tym konkretnym kroku.",C:"Generowanie tokenu jest inferencją, nie ponownym treningiem modelu. Wagi nie są wtedy skalowane przez proces uczenia.",D:"Eksperci są wyspecjalizowanymi częściami i nie muszą być identyczni. Gdyby robili dokładnie to samo, wybór routera traciłby sens."}}},
{n:9,category:"LLM",difficulty:"średnie",text:"Dlaczego nie należy wybierać modelu wyłącznie na podstawie liczby parametrów?",options:{A:"Na jakość wpływają też architektura, dane, trening, post-training i sposób użycia",B:"Liczba parametrów ma znaczenie wyłącznie dla modeli zamkniętych",C:"Wszystkie współczesne modele mają podobną liczbę parametrów",D:"Parametry wpływają tylko na szybkość tokenizacji"},correct:"A",why:"O możliwościach modelu współdecydują architektura, dane, trening, post-training, tokenizer i sposób użycia. Nowszy mniejszy model może więc przewyższać starszy większy.",lesson:{correct:"Liczba parametrów mówi o pojemności, ale nie opisuje całego modelu. Ważne są dane, architektura, trening i późniejsze dostrojenie. Znaczenie ma też kontekst i sposób użycia podczas inferencji. Typową pomyłką jest traktowanie jednego numeru jak pełnej oceny jakości.",example:"Starszy model ma 20B parametrów, a nowszy 8B. Nowszy dostał lepsze dane i skuteczniejszy trening. W konkretnym zadaniu może więc odpowiedzieć lepiej mimo mniejszego rozmiaru.",remember:"Parametry to jedna wskazówka, nie końcowy werdykt.",wrong:{B:"Parametry dotyczą zarówno modeli otwartych, jak i zamkniętych, choć producenci nie zawsze publikują ich liczbę. Nie jest to cecha wyłącznie zamkniętych modeli.",C:"Modele występują w bardzo różnych rozmiarach, od milionów do setek miliardów parametrów. Ich rozmiary nie są jednakowe.",D:"Tokenizer i parametry to osobne elementy. Parametry wpływają na działanie sieci, a nie tylko na szybkość dzielenia tekstu."}}},
{n:10,category:"LLM",difficulty:"trudne",text:"Które zdanie najtrafniej odróżnia RAG od uczenia parametrów?",options:{A:"RAG zmienia wagi modelu przy każdym pobranym dokumencie",B:"RAG zastępuje inferencję wyszukiwarką i nie używa LLM",C:"RAG zwiększa liczbę ekspertów aktywnych w modelu MoE",D:"RAG dostarcza informacje w kontekście bez konieczności zapisywania ich w wagach"},correct:"D",why:"RAG wyszukuje informacje i przekazuje je w kontekście gotowego modelu. Nie musi zmieniać wag ani trenować modelu od nowa.",lesson:{correct:"RAG najpierw wyszukuje informacje potrzebne do pytania. Następnie wkłada je do kontekstu gotowego modelu. Model tworzy odpowiedź na podstawie pytania i znalezionych treści. Typową pomyłką jest mylenie chwilowego kontekstu z trwałą zmianą wag.",example:"Użytkownik pyta o dzisiejszy regulamin. System odnajduje właściwy fragment dokumentu i dołącza go do promptu. Model korzysta z niego teraz, ale po wywołaniu nie zapisuje regulaminu na stałe w parametrach.",remember:"RAG podaje ściągę na biurko, a nie przepisuje mózg modelu.",wrong:{A:"Pobrany dokument trafia do kontekstu, a nie automatycznie do wag. Zmiana wag wymagałaby procesu treningowego.",B:"Wyszukiwarka dostarcza materiał, ale LLM nadal generuje odpowiedź. RAG łączy oba elementy.",C:"RAG nie steruje ekspertami MoE. Jego zadaniem jest wyszukanie i dołączenie informacji zewnętrznych."}}},
{n:11,category:"LLM",difficulty:"łatwe",text:"Co było głównym ograniczeniem LSTM utrudniającym skalowanie?",options:{A:"Brak możliwości przetwarzania tekstu",B:"Konieczność stosowania bazy wektorowej",C:"Sekwencyjne liczenie kolejnych kroków",D:"Brak jakiejkolwiek pamięci wcześniejszych elementów"},correct:"C",why:"LSTM przetwarza sekwencję krok po kroku, więc kolejny krok zależy od poprzedniego. Utrudnia to równoległe obliczenia i skalowanie.",lesson:{correct:"LSTM czyta sekwencję krok po kroku. Aby policzyć krok dziesiąty, musi wcześniej przejść przez krok dziewiąty. Taka zależność utrudnia wykonanie wielu obliczeń jednocześnie na GPU. Typową pomyłką jest uznanie, że problemem był całkowity brak pamięci.",example:"Wyobraź sobie jedną kasę i dziesięć osób w kolejce. Dziesiąta osoba nie może zostać obsłużona przed dziewiątą. Transformer przypomina więcej stanowisk, które pozwalają wykonywać więcej pracy równolegle.",remember:"LSTM idzie po schodach stopień po stopniu; to spowalnia skalowanie.",wrong:{A:"LSTM został stworzony właśnie do przetwarzania sekwencji, w tym tekstu. Problemem była metoda krok po kroku, nie brak tej możliwości.",B:"Baza wektorowa nie jest warunkiem działania LSTM. To narzędzie używane między innymi w systemach RAG.",D:"LSTM zaprojektowano po to, by lepiej zachowywać informacje z wcześniejszych elementów. Ograniczenie dotyczyło sekwencyjności obliczeń."}}},
{n:12,category:"LLM",difficulty:"średnie",text:"Czym context engineering różni się od samego prompt engineering?",options:{A:"Polega wyłącznie na skracaniu poleceń",B:"Obejmuje dostarczenie instrukcji, dokumentów, danych i wyników narzędzi potrzebnych do zadania",C:"Zmienia parametry modelu bez treningu",D:"Dotyczy tylko lokalnych modeli open-source"},correct:"B",why:"Prompt engineering skupia się na sformułowaniu polecenia, a context engineering szerzej organizuje wszystkie potrzebne informacje. Kontekst może zawierać dokumenty, dane z API, historię i wyniki narzędzi.",lesson:{correct:"Prompt engineering pyta, jak dobrze napisać polecenie. Context engineering pyta, co model musi dostać, aby wykonać zadanie. Obejmuje instrukcję, dane, dokumenty, historię i wyniki narzędzi. Typową pomyłką jest ograniczenie kontekstu do jednego ładnie napisanego zdania.",example:"Polecenie „podaj cenę biletu” jest jasne, ale nie zawiera ceny. System pobiera aktualny cennik i dodaje go do wejścia. Dopiero pełny zestaw informacji pozwala modelowi odpowiedzieć bez zgadywania.",remember:"Dobry prompt mówi, co robić; dobry kontekst daje też wszystko, czego potrzeba.",wrong:{A:"Skracanie może oszczędzać tokeny, ale nie wyczerpuje context engineering. Najważniejsze jest dobranie potrzebnych informacji.",C:"Kontekst jest wejściem do gotowego modelu i nie zmienia jego parametrów. Bez treningu wagi pozostają takie same.",D:"Każdy LLM odpowiada na podstawie swojego wejścia. Context engineering dotyczy modeli lokalnych i chmurowych."}}},
{n:13,category:"API",difficulty:"łatwe",text:"Dlaczego dwa osobne wywołania Chat Completions nie tworzą pamięci rozmowy automatycznie?",options:{A:"API jest bezstanowe i historię trzeba ponownie przesłać w messages",B:"Rola assistant usuwa wcześniejsze wiadomości",C:"Tokenizer nie potrafi kodować dialogu",D:"Pamięć działa wyłącznie z modelem reasoningowym"},correct:"A",why:"Każde wywołanie API jest bezstanowe. Iluzja pamięci powstaje dopiero wtedy, gdy aplikacja ponownie przesyła wcześniejsze wiadomości.",lesson:{correct:"Każde żądanie Chat Completions zaczyna się od danych, które właśnie wysyłasz. Serwer nie zakłada automatycznie znajomości poprzedniego żądania. Aplikacja buduje pamięć przez ponowne dołączenie historii do messages. Typową pomyłką jest przypisanie tej pracy samemu modelowi.",example:"W pierwszym żądaniu piszesz „Mam na imię Ed”. W drugim wysyłasz tylko „Jak mam na imię?”. Bez wcześniejszej wiadomości w nowej liście model nie otrzymał informacji o imieniu.",remember:"Nie wyślesz historii — model jej nie zobaczy.",wrong:{B:"Rola assistant pozwala przekazać wcześniejsze odpowiedzi modelu. Nie usuwa ona historii, lecz pomaga ją odtworzyć.",C:"Tokenizer potrafi zamienić dialog na tokeny tak jak inny tekst. Problem dotyczy tego, czego nie dołączono do nowego żądania.",D:"Bezstanowość dotyczy wywołań API niezależnie od typu modelu. Reasoning nie tworzy automatycznej pamięci między żądaniami."}}},
{n:14,category:"Narzędzia",difficulty:"średnie",text:"Po co używać tiktoken.encoding_for_model(...) zamiast zakładać stały podział tekstu?",options:{A:"Aby wysłać prompt bezpośrednio do API",B:"Aby zmienić liczbę parametrów modelu",C:"Aby pobrać brakujące wagi modelu",D:"Aby dobrać schemat tokenizacji właściwy dla wskazanego modelu"},correct:"D",why:"Różne modele mogą używać różnych schematów tokenizacji. encoding_for_model(...) dobiera encoding do wskazanego modelu.",lesson:{correct:"Tokenizer dzieli tekst na fragmenty i przypisuje im identyfikatory. Różne modele mogą używać różnych reguł tego podziału. Funkcja encoding_for_model dobiera reguły do wskazanego modelu. Typową pomyłką jest założenie, że jeden tekst zawsze ma tę samą liczbę tokenów.",example:"Słowo może być jednym tokenem w jednym encodingu i dwoma w innym. Ten sam prompt może więc zająć różną część okna kontekstu. Dobranie tokenizera do modelu daje właściwy pomiar.",remember:"Najpierw model, potem jego encoding — nie licz tokenów na oko.",wrong:{A:"tiktoken analizuje tokenizację lokalnie i nie wysyła promptu do modelu. Wywołanie API wymaga osobnego klienta.",B:"Tokenizer zamienia tekst na identyfikatory, ale nie zmienia wag ani liczby parametrów. To inna warstwa systemu.",C:"Pobieranie wag nie jest zadaniem tiktoken. Narzędzie służy do kodowania i dekodowania tekstu."}}},
{n:15,category:"Web scraping",difficulty:"trudne",text:"Scraper zwraca pusty tekst ze strony renderowanej przez JavaScript. Co jest najbezpieczniejszym zachowaniem przed wywołaniem LLM?",options:{A:"Wysłać pusty prompt i poprosić model o odtworzenie strony",B:"Przerwać przetwarzanie lub użyć narzędzia renderującego stronę, zamiast wymuszać streszczenie",C:"Zwiększyć liczbę parametrów modelu",D:"Usunąć walidację URL, aby pobrać więcej treści"},correct:"B",why:"Pusty tekst może oznaczać stronę renderowaną przez JavaScript lub blokadę. Lepiej przerwać albo użyć odpowiedniego renderowania niż pozwolić modelowi zgadywać bez danych.",lesson:{correct:"Zwykłe pobranie HTML może nie zobaczyć treści tworzonej później przez JavaScript. Pusty wynik trzeba wykryć przed wysłaniem promptu. Można przerwać działanie albo użyć narzędzia, które renderuje stronę. Typową pomyłką jest proszenie modelu o streszczenie materiału, którego nie dostał.",example:"Strona sklepu pokazuje produkty dopiero po uruchomieniu skryptów w przeglądarce. requests pobiera pusty szkielet bez opisów. Wysłanie tego do LLM zachęciłoby go do zgadywania zamiast streszczania.",remember:"Brak treści to sygnał stop, nie zaproszenie do halucynacji.",wrong:{A:"Model nie może wiernie odtworzyć strony, której treści nie otrzymał. Taki prompt zwiększa ryzyko wymyślenia informacji.",C:"Większy model nadal nie ma brakujących danych ze strony. Liczba parametrów nie naprawia nieskutecznego pobrania treści.",D:"Walidacja URL chroni przed błędnymi adresami i nie odpowiada za renderowanie JavaScript. Jej usunięcie nie ujawni brakującej treści."}}},
{n:16,category:"Narzędzia",difficulty:"średnie",text:"Dlaczego samo ollama serve nie wystarcza do pierwszego użycia konkretnego modelu?",options:{A:"Polecenie działa tylko z modelami frontier",B:"Polecenie automatycznie usuwa lokalne wagi",C:"Serwer i pobranie wag to osobne kroki; model trzeba mieć lokalnie",D:"Serwer nie udostępnia interfejsu HTTP"},correct:"C",why:"ollama serve uruchamia serwer, a ollama pull pobiera wagi. Przed wywołaniem modelu oba warunki muszą być spełnione.",lesson:{correct:"Ollama potrzebuje działającego serwera, aby odbierać żądania HTTP. Potrzebuje też plików konkretnego modelu na dysku. serve uruchamia usługę, a pull pobiera wagi. Typową pomyłką jest oczekiwanie, że jedno polecenie zrobi automatycznie obie rzeczy.",example:"Uruchamiasz serwer na porcie 11434, ale prosisz o model llama3.2, którego nie pobrano. Drzwi do magazynu są otwarte, lecz produktu nie ma na półce. Dopiero pobranie modelu pozwala obsłużyć żądanie.",remember:"serve otwiera serwer, pull dostarcza model.",wrong:{A:"Ollama służy przede wszystkim do lokalnych modeli open-source. Nie jest poleceniem ograniczonym do usług frontier.",B:"serve nie usuwa wag i nie służy do zarządzania ich kasowaniem. Jego zadaniem jest uruchomienie serwera.",D:"Serwer Ollamy właśnie udostępnia interfejs HTTP, domyślnie na porcie 11434. Brak interfejsu zaprzeczałby roli serve."}}},
{n:17,category:"API",difficulty:"łatwe",text:"Do czego służy wiadomość z rolą system?",options:{A:"Do przechowywania klucza API",B:"Do reprezentowania poprzedniej odpowiedzi użytkownika",C:"Do pobierania strony WWW",D:"Do ustawienia globalnych reguł, tonu i formatu odpowiedzi"},correct:"D",why:"Rola system przekazuje globalne instrukcje dotyczące tonu, języka, formatu i zachowania modelu. Dane użytkownika trafiają zwykle do roli user.",lesson:{correct:"Wiadomość system ustawia zasady dla całej odpowiedzi. Może określić język, ton, format i ograniczenia. Wiadomość user zawiera zwykle pytanie albo dane zadania. Typową pomyłką jest wkładanie do systemu technicznych sekretów, takich jak klucz API.",example:"System mówi: „Odpowiadaj po polsku, krótko i w punktach”. User przekazuje treść artykułu do streszczenia. Model otrzymuje jednocześnie regułę zachowania i materiał roboczy.",remember:"System ustawia zasady gry, user przynosi zadanie.",wrong:{A:"Klucz API służy klientowi do uwierzytelnienia i nie powinien trafiać do promptu. Rola system nie jest sejfem na sekrety.",B:"Poprzednia odpowiedź modelu ma rolę assistant, a wiadomość użytkownika rolę user. System opisuje zasady zachowania.",C:"Pobieranie strony wykonuje kod lub narzędzie przed wywołaniem modelu. Rola system jedynie przekazuje instrukcje tekstowe."}}},
{n:18,category:"API",difficulty:"trudne",text:"Aplikacja przy każdej turze przesyła całą dotychczasową rozmowę. Jaka jest ważna konsekwencja?",options:{A:"Koszt tokenów wejściowych zwykle rośnie wraz z długością historii",B:"Model trwale zapamiętuje rozmowę w swoich wagach",C:"Każda kolejna tura staje się bezpłatna",D:"Historia przestaje zajmować okno kontekstu"},correct:"A",why:"Pełna historia jest ponownie częścią wejścia przy każdej turze. Im dłuższa rozmowa, tym więcej tokenów wejściowych trzeba przetworzyć i rozliczyć.",lesson:{correct:"Historia daje modelowi kontekst, ale za każdym razem jest ponownie wysyłana. Wszystkie jej tokeny zajmują miejsce w oknie kontekstu. Zwykle są też ponownie rozliczane jako wejście. Typową pomyłką jest myślenie, że starsze wiadomości są przechowywane za darmo poza żądaniem.",example:"Pierwsza tura ma 100 tokenów historii. Po kilku odpowiedziach historia rośnie do 1000 tokenów. Następne pytanie wymaga przetworzenia tych 1000 tokenów plus nowej wiadomości.",remember:"Dłuższa pamięć w messages oznacza dłuższy rachunek i mniej wolnego kontekstu.",wrong:{B:"Przesłanie historii nie zmienia wag modelu. Rozmowa działa jako bieżący kontekst, a nie trwałe uczenie.",C:"Kolejne tury nie stają się darmowe, ponieważ przetwarzają coraz więcej wejścia. Koszt zwykle rośnie.",D:"Historia jest częścią sekwencji wejściowej i zajmuje okno kontekstu. Nie znika tylko dlatego, że pochodzi ze starszej tury."}}},
{n:19,category:"LLM",difficulty:"średnie",text:"Jak najlepiej wybrać model do aplikacji produkcyjnej, gdy kandydaci mają zbliżoną jakość?",options:{A:"Zawsze wybrać model z najwyższą ceną",B:"Oprzeć decyzję wyłącznie na publicznym leaderboardzie",C:"Porównać jakość, koszt i latency na reprezentatywnych danych",D:"Wybrać model o najdłuższej nazwie"},correct:"C",why:"Publiczny ranking nie zastępuje testu na własnym zadaniu. Produkcyjny wybór powinien uwzględniać jakość, koszt i latency na reprezentatywnych danych.",lesson:{correct:"Dobry model musi pasować do konkretnego zadania, nie tylko do rankingu. Trzeba zmierzyć jakość odpowiedzi, koszt i czas działania. Test powinien używać danych podobnych do produkcyjnych. Typową pomyłką jest wybór najdroższego modelu bez sprawdzenia, czy daje potrzebną korzyść.",example:"Dwa modele osiągają 95% i 94% jakości w twoim teście. Drugi odpowiada dwa razy szybciej i kosztuje trzy razy mniej. Dla aplikacji z dużym ruchem może być lepszym punktem równowagi.",remember:"Testuj swoje zadanie: jakość, cena i czas muszą spotkać się w jednym wyborze.",wrong:{A:"Wysoka cena nie gwarantuje najlepszego wyniku dla każdego prostego zadania. Czasem tańszy model spełnia wymagania równie dobrze.",B:"Leaderboard mierzy ogólne benchmarki, a nie dokładnie twoje dane i kryteria. Jest wskazówką, nie ostatecznym testem.",D:"Nazwa modelu nie mówi nic o jakości, koszcie ani latency. To nie jest kryterium inżynieryjne."}}},
{n:20,category:"Agentic AI",difficulty:"trudne",text:"Co technicznie oznacza autonomia agenta opartego na LLM?",options:{A:"Model uzyskuje własną wolę i działa poza systemem",B:"Model wybiera następny krok, system wykonuje narzędzie, a wynik wraca do kolejnego wywołania",C:"Jedno wywołanie modelu zawsze kończy całe wieloetapowe zadanie",D:"Agent nie potrzebuje kontekstu ani narzędzi"},correct:"B",why:"Autonomia agenta oznacza technicznie wybieranie kolejnego kroku procesu przez model. System wykonuje wskazane narzędzie i zwraca wynik do następnego obiegu pętli.",lesson:{correct:"Agent używa LLM jako elementu sterującego workflow. Model wskazuje, co powinno wydarzyć się dalej. System wykonuje narzędzie i przekazuje wynik z powrotem do modelu. Typową pomyłką jest przypisywanie temu mechanizmowi własnej woli zamiast widzenia pętli wywołań.",example:"Użytkownik prosi o rezerwację restauracji. Model najpierw wybiera wyszukiwarkę, potem sprawdzenie terminów, a na końcu funkcję rezerwacji. Po każdym kroku wynik wraca jako nowy kontekst do kolejnej decyzji.",remember:"Agent to pętla: decyzja, narzędzie, wynik i następna decyzja.",wrong:{A:"Autonomia jest tu pojęciem technicznym, a nie świadomością czy wolną wolą. Model wybiera kroki tylko w ramach zbudowanego systemu.",C:"Wielostopniowe zadanie zwykle wymaga kilku wywołań i wyników narzędzi. Jedno wywołanie nie musi wystarczyć.",D:"Kontekst i narzędzia są kluczowymi elementami systemu agentowego. Bez nich model miałby mniej informacji i możliwości działania."}}}
];
const quiz=document.querySelector("#quiz");
const letters=["A","B","C","D"];
const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
questions.forEach(question=>{
const article=document.createElement("article");
article.className="question";
article.id=`question-${question.n}`;
const options=letters.map(letter=>`<label class="option"><input type="radio" name="q${question.n}" value="${letter}"><strong>${letter}.</strong><span>${escapeHtml(question.options[letter])}</span></label>`).join("");
article.innerHTML=`<div class="meta"><span class="tag">${escapeHtml(question.category)}</span><span class="tag difficulty">${escapeHtml(question.difficulty)}</span></div><h2>${question.n}. ${escapeHtml(question.text)}</h2><div class="options">${options}<label class="option unknown"><input type="radio" name="q${question.n}" value="?"><strong>?</strong><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="confidence${question.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" aria-live="polite"></div>`;
quiz.appendChild(article);
});
let lastResults=null;
const selectedAnswer=n=>document.querySelector(`input[name="q${n}"]:checked`)?.value||"";
const confidence=n=>document.querySelector(`select[name="confidence${n}"]`).value;
const lessonBlock=(question,chosen)=>{
const wrong=chosen==="?"?"":`<div class="lesson-part"><strong>Twoja odpowiedź</strong>${escapeHtml(question.lesson.wrong[chosen])}</div>`;
const intro=chosen==="?"?"<p>Bez zgadywania — oto spokojne wyjaśnienie.</p>":"";
return `${intro}${wrong}<div class="lesson-part"><strong>Poprawna myśl</strong>${escapeHtml(question.lesson.correct)}</div><div class="lesson-part"><strong>Przykład</strong>${escapeHtml(question.lesson.example)}</div><div class="lesson-part"><strong>Zapamiętaj</strong>${escapeHtml(question.lesson.remember)}</div>`;
};
document.querySelector("#check").addEventListener("click",()=>{
const missing=questions.filter(question=>!selectedAnswer(question.n));
document.querySelectorAll(".question").forEach(element=>element.classList.remove("missing"));
if(missing.length){
missing.forEach(question=>document.querySelector(`#question-${question.n}`).classList.add("missing"));
document.querySelector(`#question-${missing[0].n}`).scrollIntoView({behavior:"smooth",block:"center"});
alert(`Uzupełnij odpowiedź A–D albo „Nie mam pojęcia” w ${missing.length} pytaniach.`);
return;
}
let score=0;
let unknown=0;
lastResults=questions.map(question=>{
const chosen=selectedAnswer(question.n);
const feedback=document.querySelector(`#question-${question.n} .feedback`);
feedback.className="feedback show";
if(chosen===question.correct){
score++;
feedback.classList.add("ok");
feedback.innerHTML=`<h3>OK · ${question.correct}</h3><p>${escapeHtml(question.why)}</p>`;
return{question,chosen,status:"OK",confidence:confidence(question.n)};
}
if(chosen==="?"){
unknown++;
feedback.classList.add("learn");
feedback.innerHTML=`<h3>NIE WIEM · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"NIE WIEM",confidence:confidence(question.n)};
}
feedback.classList.add("bad");
feedback.innerHTML=`<h3>BŁĄD · Twoja: ${chosen} · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"BŁĄD",confidence:confidence(question.n)};
});
const percent=Math.round(score/questions.length*100);
const summary=document.querySelector("#summary");
summary.className="show";
summary.innerHTML=`<strong>Wynik: ${score}/20 · ${percent}%</strong><br>Nie wiem: ${unknown}<p class="small">Przeczytaj krótkie wyjaśnienia oraz mini-lekcje pod pytaniami oznaczonymi BŁĄD lub NIE WIEM.</p>`;
document.querySelector("#downloadResults").disabled=false;
summary.scrollIntoView({behavior:"smooth",block:"start"});
});
const tableRow=result=>`| ${result.question.n} | ${result.chosen||""} | ${result.confidence||""} |  |`;
const download=(filename,content)=>{
const blob=new Blob([content],{type:"text/markdown;charset=utf-8"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=filename;
link.click();
URL.revokeObjectURL(link.href);
};
document.querySelector("#downloadAnswers").addEventListener("click",()=>{
const rows=questions.map(question=>tableRow({question,chosen:selectedAnswer(question.n),confidence:confidence(question.n)})).join("\n");
download("25.09.2026_my_answers.md",`# Moje odpowiedzi – 25.09.2026\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---:|:---:|:---:|---|\n${rows}\n\n## Notatki\n`);
});
document.querySelector("#downloadResults").addEventListener("click",()=>{
if(!lastResults)return;
const score=lastResults.filter(result=>result.status==="OK").length;
const unknown=lastResults.filter(result=>result.status==="NIE WIEM").length;
const percent=Math.round(score/questions.length*100);
const detail=lastResults.map(result=>`| ${result.question.n} | ${result.chosen} | ${result.question.correct} | ${result.status} | ${result.confidence||""} | ${result.question.why.replace(/\|/g,"\\|")} |`).join("\n");
const strong=[...new Set(lastResults.filter(result=>result.status==="OK").map(result=>result.question.category))];
const repeat=[...new Set(lastResults.filter(result=>result.status!=="OK").map(result=>result.question.category))];
const strongText=strong.length?strong.map(value=>`- ${value}`).join("\n"):"- Brak kategorii z poprawną odpowiedzią.";
const repeatText=repeat.length?repeat.map(value=>`- ${value}`).join("\n"):"- Brak — wszystkie odpowiedzi są poprawne.";
download("25.09.2026_results.md",`# Wynik quizu — 25.09.2026\n\n## Wynik\n\n${score}/20 · ${percent}%\n\nNie wiem: ${unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---:|:---:|:---:|:---:|:---:|---|\n${detail}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${repeatText}\n`);
});
</script>
</body>
</html>
