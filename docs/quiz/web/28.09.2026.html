const questions=[{"n": 1, "category": "LLM", "difficulty": "łatwe", "text": "Dlaczego tokenizacja jest uważana za kompromis między znakami a całymi słowami?", "options": {"A": "Bo zawsze zamienia każde słowo na dokładnie jeden znak", "B": "Bo utrzymuje ograniczony słownik, a jednocześnie pozwala dzielić tekst na mniejsze fragmenty", "C": "Bo usuwa potrzebę jakichkolwiek identyfikatorów numerycznych", "D": "Bo zastępuje trening modelu samym liczeniem liter"}, "correct": "B", "why": "Tokenizacja łączy ograniczony słownik z możliwością dzielenia tekstu na mniejsze fragmenty; to kompromis między znakami a całymi słowami.", "lesson": {"correct": "Wyobraź sobie dwa skrajne sposoby czytania tekstu. Możesz czytać literę po literze albo całe słowa naraz. Litery dają mały słownik, ale dużo pracy. Całe słowa są wygodne, ale słownik puchnie. Tokenizacja stoi pośrodku: czasem bierze całe słowo, a czasem kawałek. Dzięki temu słownik zostaje rozsądny, a tekst nadal da się zapisać.", "example": "Słowo „niewiarygodny” może nie mieć jednego gotowego wpisu. Tokenizer może podzielić je na mniejsze kawałki, które już zna. Częste słowa mogą zostać jednym tokenem. Rzadkie słowa rozbijają się na fragmenty. Model nadal „widzi” cały tekst, tylko w częściach.", "remember": "Tokenizacja = mały słownik + elastyczne kawałki tekstu.", "wrong": {"A": "Tokenizacja nie wymusza zamiany każdego słowa na jeden znak. Znak to tylko jedna z możliwych wielkości tokenu.", "C": "Po tokenizacji pojawiają się właśnie numeryczne token ID. Identyfikatory nie znikają.", "D": "Tokenizacja przygotowuje tekst do modelu. Nie zastępuje treningu ani uczenia parametrów."}}}, {"n": 2, "category": "API", "difficulty": "łatwe", "text": "Do czego służy wiadomość z rolą system w Chat Completions?", "options": {"A": "Do przechowywania klucza API", "B": "Do reprezentowania poprzedniej odpowiedzi użytkownika", "C": "Do pobierania strony WWW", "D": "Do ustawienia globalnych reguł, tonu i formatu odpowiedzi"}, "correct": "D", "why": "Rola system ustawia globalne reguły zachowania, tonu i formatu odpowiedzi.", "lesson": {"correct": "Wiadomość system mówi modelowi, jak ma się zachować. Może ustawić język, ton, format i ograniczenia. To reguły gry dla odpowiedzi. Wiadomość user zwykle przynosi konkretne zadanie albo dane. Typową pomyłką jest mylenie roli system z miejscem na sekrety techniczne.", "example": "System mówi: „Odpowiadaj po polsku, krótko i w punktach”. User wkleja artykuł i prosi o streszczenie. Model dostaje jednocześnie zasady i treść do pracy. Bez roli system reguły trzeba byłoby powtarzać przy każdym pytaniu.", "remember": "System ustawia zasady gry, user przynosi zadanie.", "wrong": {"A": "Klucz API służy do uwierzytelnienia klienta i nie powinien trafiać do promptu. Rola system nie jest sejfem.", "B": "Poprzednia odpowiedź modelu ma rolę assistant, a pytanie użytkownika rolę user.", "C": "Pobieranie strony robi kod lub narzędzie przed wywołaniem modelu. System tylko przekazuje instrukcje."}}}, {"n": 3, "category": "LLM", "difficulty": "łatwe", "text": "Co może być tokenem?", "options": {"A": "Całe słowo, fragment słowa albo nawet pojedynczy znak", "B": "Wyłącznie całe zdanie bez podziału", "C": "Tylko numer warstwy w sieci neuronowej", "D": "Wyłącznie lokalna ścieżka do pliku modelu"}, "correct": "A", "why": "Token może być całym słowem, fragmentem słowa albo pojedynczym znakiem.", "lesson": {"correct": "Token to kawałek tekstu, którym model operuje. Nie musi to być całe słowo. Czasem jest nim popularne słowo w całości. Czasem tylko końcówka albo litera. Wszystko zależy od słownika tokenizera. Typową pomyłką jest myślenie „jeden token = jedno słowo”.", "example": "Angielskie „ing” może mieć własny token, bo pojawia się bardzo często. Krótkie „Hi” może być jednym tokenem. Długie, rzadkie słowo może rozpaść się na kilka części. Ten sam tekst różni modele mogą podzielić inaczej.", "remember": "Token bywa słowem, kawałkiem albo znakiem — nie zawsze słowem.", "wrong": {"B": "Tokenizacja właśnie dzieli tekst. Całe zdanie bez podziału nie jest typową jednostką tokenu.", "C": "Numer warstwy dotyczy architektury sieci, a nie fragmentu tekstu wejściowego.", "D": "Ścieżka do pliku modelu to lokalizacja wag, nie jednostka tekstu."}}}, {"n": 4, "category": "LLM", "difficulty": "średnie", "text": "Jaka jest główna intuicja Chinchilla scaling laws?", "options": {"A": "Każdy wzrost liczby parametrów zawsze poprawia model", "B": "Dane treningowe można zastąpić dłuższym reasoningiem", "C": "Rozmiar modelu trzeba równoważyć ilością danych i dostępnych obliczeń", "D": "Najlepszy model powinien aktywować wszystkie parametry naraz"}, "correct": "C", "why": "Chinchilla scaling laws podkreślają równowagę między rozmiarem modelu, danymi i obliczeniami.", "lesson": {"correct": "Prawo skalowania mówi o dopasowaniu trzech rzeczy: rozmiaru modelu, danych i obliczeń. Sam duży model nie wystarczy. Potrzebuje odpowiedniej ilości materiału do nauki. Potrzebuje też mocy i czasu na trening. Typową pomyłką jest powiększanie tylko liczby parametrów.", "example": "Wyobraź sobie ogromnego ucznia z tysiącem zeszytów i jedną stroną materiału. Dodatkowe zeszyty prawie nic nie dadzą. Lepszy wynik da rozsądna liczba zeszytów, dużo ćwiczeń i wystarczająco dużo czasu na naukę.", "remember": "Model, dane i obliczenia muszą rosnąć w równowadze.", "wrong": {"A": "Więcej parametrów zwiększa pojemność, ale bez danych i obliczeń potencjał może zostać niewykorzystany.", "B": "Reasoning działa podczas odpowiadania gotowego modelu i nie zastępuje danych treningowych.", "D": "Aktywowanie parametrów dotyczy m.in. MoE i nie jest główną intuicją Chinchilla."}}}, {"n": 5, "category": "LLM", "difficulty": "średnie", "text": "Czym token ID różni się od embeddingu?", "options": {"A": "Token ID jest wektorem, a embedding jest literą", "B": "Token ID zmienia wagi modelu, a embedding ich nie zmienia", "C": "Token ID jest tylko dla modeli lokalnych, a embedding tylko dla frontier", "D": "Token ID to numer przypisany fragmentowi tekstu, a embedding to późniejsza reprezentacja wektorowa"}, "correct": "D", "why": "Token ID to numer fragmentu tekstu; embedding pojawia się później jako wektor wewnątrz modelu.", "lesson": {"correct": "Najpierw tekst staje się tokenem, czyli kawałkiem napisu. Potem ten kawałek dostaje numer: token ID. Dopiero później model zamienia numer na wektor liczb zwany embeddingiem. To trzy różne etapy. Typową pomyłką jest nazywanie samego numeru „wektorem”.", "example": "Fragment „cat” może dostać ID 12345. Embedding tego tokenu może wyglądać jak lista: 0.12, -0.83, 0.44 i wiele kolejnych liczb. Numer jest jak numer w szafce. Wektor jest już opisem zawartości używanym przez sieć.", "remember": "Token to tekst, ID to numer, embedding to wektor — trzy różne rzeczy.", "wrong": {"A": "Jest odwrotnie w praktyce: ID to numer, a embedding jest wektorem. Litera nie jest definicją embeddingu.", "B": "Samo przypisanie ID ani samo wczytanie embeddingu nie jest treningiem wag. To etap reprezentacji wejścia.", "C": "Rozróżnienie nie zależy od tego, czy model jest lokalny czy frontier. Dotyczy obu."}}}, {"n": 6, "category": "LLM", "difficulty": "średnie", "text": "Jaką rolę pełni router w modelu Mixture of Experts?", "options": {"A": "Zmienia prompt użytkownika na tokeny", "B": "Wybiera ekspertów używanych dla danego wejścia", "C": "Przechowuje wszystkie dane treningowe", "D": "Uruchamia zawsze wszystkich ekspertów"}, "correct": "B", "why": "Router wybiera ekspertów używanych dla danego wejścia.", "lesson": {"correct": "Model MoE ma wiele wyspecjalizowanych części zwanych ekspertami. Router decyduje, którzy eksperci mają pracować przy danym wejściu. Reszta nie musi liczyć w tym kroku. Dzięki temu duży model może używać tylko części parametrów. Typową pomyłką jest założenie, że zawsze włączają się wszyscy.", "example": "Recepcja w przychodni nie wysyła pacjenta do wszystkich lekarzy naraz. Kieruje go do dwóch pasujących specjalistów. Router działa podobnie: wybiera drogę do potrzebnych ekspertów.", "remember": "Router wybiera ekspertów, zamiast włączać wszystkich.", "wrong": {"A": "Zamiana tekstu na tokeny to zadanie tokenizera, nie routera MoE.", "C": "Router nie jest bazą danych treningowych. Podejmuje decyzję o aktywacji.", "D": "Sens MoE polega właśnie na tym, że nie wszyscy eksperci muszą działać naraz."}}}, {"n": 7, "category": "LLM", "difficulty": "średnie", "text": "Dlaczego limit kontekstu podawany w tokenach nie oznacza tej samej liczby słów?", "options": {"A": "Bo jedno słowo może zajmować jeden lub kilka tokenów zależnie od języka i treści", "B": "Bo token zawsze równa się dokładnie jednemu znakowi", "C": "Bo okno kontekstu liczy wyłącznie spacje", "D": "Bo modele nie przetwarzają tekstu w ogóle"}, "correct": "A", "why": "Liczba słów odpowiadająca danej liczbie tokenów zależy od języka i treści.", "lesson": {"correct": "Model liczy miejsce w oknie kontekstu tokenami, nie słowami. Jedno krótkie, częste słowo może być jednym tokenem. Długie albo rzadkie słowo może zająć kilka tokenów. Dlatego 128 000 tokenów to nie to samo co 128 000 słów. Typową pomyłką jest liczenie limitu „na oko” po słowach.", "example": "Zdanie po angielsku może zmieścić się w 20 tokenach. To samo znaczenie po innym języku albo z trudnymi nazwami może zająć więcej. Przy limicie 1000 tokenów czasem zmieścisz mniej słów, niż myślisz.", "remember": "Limit jest w tokenach; słowa to tylko przybliżenie.", "wrong": {"B": "Token nie zawsze jest jednym znakiem. Może być większy lub mniejszy.", "C": "Okno kontekstu liczy tokeny całego wejścia, nie tylko spacje.", "D": "Modele właśnie przetwarzają tekst, ale po zamianie na tokeny."}}}, {"n": 8, "category": "Narzędzia", "difficulty": "łatwe", "text": "Na jakim porcie domyślnie nasłuchuje serwer Ollama?", "options": {"A": "8080", "B": "3000", "C": "11434", "D": "5000"}, "correct": "C", "why": "Serwer Ollama domyślnie nasłuchuje na porcie 11434.", "lesson": {"correct": "Ollama uruchamia lokalny serwer HTTP. Domyślny port to 11434. Na ten adres kierujesz klienta API albo sprawdzenie połączenia. To ważne, gdy łączysz SDK z lokalnym modelem. Typową pomyłką jest mylenie tego portu z popularnymi 3000 albo 8080.", "example": "Ustawiasz base_url na http://localhost:11434/v1. Jeśli serwer działa, klient może wysłać Chat Completions. Zły port da błąd połączenia nawet przy poprawnym prompcie.", "remember": "Ollama = lokalny serwer na 11434.", "wrong": {"A": "8080 bywa używany przez inne aplikacje, ale nie jest domyślnym portem Ollamy.", "B": "3000 często kojarzy się z frontendem developerskim, nie z Ollamą.", "D": "5000 też bywa portem innych usług; Ollama używa 11434."}}}, {"n": 9, "category": "LLM", "difficulty": "trudne", "text": "Jaki jest główny problem podejścia „znak po znaku” dla sieci neuronowej?", "options": {"A": "Słownik znaków jest zbyt duży, by kiedykolwiek zmieścić litery", "B": "Model musi sam składać znaki w jednostki, rozpoznawać słowa i przypisywać im znaczenie", "C": "Znakowe wejście uniemożliwia późniejsze użycie transformerów", "D": "Każdy znak musi mieć osobny embedding o długości miliona liczb"}, "correct": "B", "why": "Przy znakach sieć musi sama składać litery, rozpoznawać słowa i przypisywać znaczenie.", "lesson": {"correct": "Podejście znakowe ma mały słownik, więc wygląda prosto. Ale sieć dostaje same literki. Musi sama zauważyć, że k + o + t tworzy „kot”. Potem musi jeszcze nauczyć się, co to słowo znaczy. To zostawia bardzo dużo pracy modelowi. Typową pomyłką jest myślenie, że mały słownik zawsze oznacza łatwiejsze uczenie.", "example": "Dla słowa „kot” wejście to trzy osobne znaki. Model najpierw składa je w całość. Dopiero później może uczyć się znaczenia. Przy tokenach często dostaje większy kawałek od razu i mniej pracy „klejenia” zrzuca na sieć.", "remember": "Mały słownik znaków = dużo pracy składania dla sieci.", "wrong": {"A": "Słownik znaków jest właśnie mały i ograniczony. To zaleta, nie główny problem.", "C": "Problem nie polega na zakazie transformerów. Chodzi o ilość pracy przy składaniu znaczenia ze znaków.", "D": "Notatki nie wymagają embeddingu o długości miliona dla każdego znaku. To nie jest opisany problem."}}}, {"n": 10, "category": "API", "difficulty": "średnie", "text": "Dlaczego dwa osobne wywołania Chat Completions nie tworzą pamięci rozmowy automatycznie?", "options": {"A": "Rola assistant usuwa wcześniejsze wiadomości", "B": "Tokenizer nie potrafi kodować dialogu", "C": "Pamięć działa wyłącznie z modelem reasoningowym", "D": "API jest bezstanowe i historię trzeba ponownie przesłać w messages"}, "correct": "D", "why": "API jest bezstanowe; historię trzeba ponownie przesłać w messages.", "lesson": {"correct": "Każde wywołanie API zaczyna się od danych, które właśnie wysyłasz. Serwer nie pamięta poprzedniego żądania sam z siebie. Aplikacja buduje iluzję pamięci, dołączając historię do messages. Typową pomyłką jest przypisywanie pamięci samemu modelowi między wywołaniami.", "example": "Najpierw piszesz „Mam na imię Ed”. Potem wysyłasz tylko „Jak mam na imię?”. Bez wcześniejszej wiadomości w nowej liście model nie zobaczy imienia. Trzeba przesłać obie wiadomości razem.", "remember": "Nie wyślesz historii — model jej nie zobaczy.", "wrong": {"A": "Rola assistant pomaga odtworzyć wcześniejsze odpowiedzi modelu, a nie usuwa historii.", "B": "Tokenizer koduje dialog tak jak inny tekst. Problem dotyczy braku historii w żądaniu.", "C": "Bezstanowość dotyczy wywołań API niezależnie od typu modelu."}}}, {"n": 11, "category": "LLM", "difficulty": "łatwe", "text": "Jaka jest główna zaleta podejścia znakowego przy budowie słownika?", "options": {"A": "Model od razu rozumie każde nowe nazwisko bez nauki", "B": "Każde słowo świata ma wtedy jeden stały token", "C": "Słownik pozostaje stosunkowo mały, bo liczba znaków jest ograniczona", "D": "Nie trzeba w ogóle trenować sieci neuronowej"}, "correct": "C", "why": "Podejście znakowe ma mały słownik, bo liczba znaków jest ograniczona.", "lesson": {"correct": "Znaków jest stosunkowo mało: litery, cyfry, interpunkcja i znaki specjalne. Dlatego słownik może być mały. To jest właśnie zaleta podejścia znakowego. Minusem jest duża praca sieci przy składaniu znaczenia. Typową pomyłką jest mylenie zalety małego słownika z „darmowym rozumieniem”.", "example": "Alfabet i typowe znaki mieszczą się w ograniczonej liście. Nie musisz dopisywać osobnego wpisu dla każdego nazwiska świata. Ale słowo „Kowalski” i tak trzeba złożyć z liter. Mały słownik nie zwalnia modelu z nauki.", "remember": "Znakowo: mały słownik, dużo składania.", "wrong": {"A": "Mały słownik nie daje automatycznego rozumienia nazwisk. Znaczenie nadal trzeba wyuczyć.", "B": "To opisuje podejście słowowe, nie znakowe.", "D": "Sieć nadal trzeba trenować. Tokenizacja tylko zmienia formę wejścia."}}}, {"n": 12, "category": "LLM", "difficulty": "trudne", "text": "Które zdanie najtrafniej odróżnia RAG od uczenia parametrów?", "options": {"A": "RAG dostarcza informacje w kontekście bez konieczności zapisywania ich w wagach", "B": "RAG zmienia wagi modelu przy każdym pobranym dokumencie", "C": "RAG zastępuje inferencję wyszukiwarką i nie używa LLM", "D": "RAG zwiększa liczbę ekspertów aktywnych w modelu MoE"}, "correct": "A", "why": "RAG dostarcza informacje w kontekście bez konieczności zapisywania ich w wagach.", "lesson": {"correct": "RAG najpierw wyszukuje potrzebne informacje. Potem wkłada je do kontekstu gotowego modelu. Model odpowiada na podstawie pytania i znalezionych treści. Nie musi przy tym zapisywać dokumentu w swoich wagach. Typową pomyłką jest mylenie chwilowego kontekstu z treningiem.", "example": "Użytkownik pyta o dzisiejszy regulamin. System znajduje właściwy fragment i dołącza go do promptu. Model korzysta z niego teraz. Po wywołaniu regulamin nie staje się trwałym parametrem modelu.", "remember": "RAG podaje ściągę na biurko, a nie przepisuje mózg modelu.", "wrong": {"B": "Pobrany dokument trafia do kontekstu, a nie automatycznie do wag.", "C": "Wyszukiwarka dostarcza materiał, ale LLM nadal generuje odpowiedź.", "D": "RAG nie steruje ekspertami MoE. Dostarcza informacje zewnętrzne."}}}, {"n": 13, "category": "LLM", "difficulty": "średnie", "text": "Co dzieje się, gdy słownik oparty na całych słowach spotyka nowe słowo, którego nie zna?", "options": {"A": "Model automatycznie dopisuje słowo do wag treningowych", "B": "Informacja może zostać utracona przez oznaczenie typu UNKNOWN", "C": "Tokenizacja znakowa staje się wtedy niemożliwa", "D": "Limit kontekstu rośnie automatycznie o jedno słowo"}, "correct": "B", "why": "Nieznane słowo może zostać oznaczone jako UNKNOWN, co oznacza utratę informacji.", "lesson": {"correct": "Słownik samych całych słów musi znać wcześniej każde słowo. Nowe nazwisko, literówka albo neologizm mogą wypaść poza listę. Wtedy pojawia się oznaczenie w stylu UNKNOWN. Model traci szczegóły tego słowa. Typową pomyłką jest wiara, że słownik słów „jakoś ogarnie wszystko”.", "example": "Słowo „superhipernowoczesny” może nie istnieć w słowniku. Zamiast sensownych części model widzi tylko UNKNOWN. Traci informację, że chodzi o coś bardzo nowoczesnego. Tokenizacja na fragmenty lepiej radzi sobie z takimi przypadkami.", "remember": "Słownik samych słów + nowe słowo = ryzyko UNKNOWN i utraty treści.", "wrong": {"A": "Samo spotkanie nowego słowa w wejściu nie dopisuje go automatycznie do wag.", "C": "Podejście znakowe nadal istnieje jako osobna idea; problem dotyczy słownika słów.", "D": "Limit kontekstu nie rośnie automatycznie przez nieznane słowo."}}}, {"n": 14, "category": "LLM", "difficulty": "średnie", "text": "Dlaczego reasoning zalicza się do inference-time scaling?", "options": {"A": "Powiększa zbiór danych treningowych po każdym pytaniu", "B": "Trwale dopisuje nowe fakty do parametrów", "C": "Zwiększa pracę gotowego modelu podczas tworzenia odpowiedzi", "D": "Zawsze uruchamia większy wariant modelu"}, "correct": "C", "why": "Reasoning zwiększa pracę gotowego modelu podczas tworzenia odpowiedzi.", "lesson": {"correct": "Reasoning dzieje się po treningu, gdy model już istnieje. Gotowy model wykonuje więcej kroków przed finalną odpowiedzią. Większy wysiłek dotyczy jednego użycia. Parametry nie muszą się przez to trwale zmieniać. Typową pomyłką jest nazywanie reasoningiem dalszego uczenia wag.", "example": "Model może od razu zgadnąć wynik albo najpierw rozłożyć zadanie na kroki i sprawdzić rozwiązanie. Druga wersja zużywa więcej pracy teraz. Po odpowiedzi model ma jednak te same parametry co wcześniej.", "remember": "Reasoning wydłuża myślenie teraz, nie przepisuje wag na stałe.", "wrong": {"A": "Zbiór treningowy nie rośnie automatycznie po pytaniu użytkownika.", "B": "Dodatkowe kroki analizy nie zapisują nowych faktów w parametrach.", "D": "Reasoning nie wymaga obowiązkowo większego modelu; ten sam model może dostać więcej pracy."}}}, {"n": 15, "category": "LLM", "difficulty": "trudne", "text": "Który schemat najlepiej opisuje drogę tekstu przez model językowy według notatek o tokenizacji?", "options": {"A": "embedding → token ID → tekst → tokenizer", "B": "transformer → UNKNOWN → całe słowa → znaki", "C": "parametry → RAG → Ollama → scraper", "D": "tekst → tokenizacja → tokeny → token IDs → embeddingi → transformer"}, "correct": "D", "why": "Ścieżka to tekst → tokenizacja → tokeny → token IDs → embeddingi → transformer.", "lesson": {"correct": "Najpierw jest zwykły tekst. Tokenizer tnie go na tokeny. Każdy token dostaje numer ID. Dopiero potem pojawiają się embeddingi, czyli wektory. Te wektory idą do transformera. Typową pomyłką jest zaczynanie historii od wektorów albo od transformera.", "example": "Zdanie „Hello world” najpierw staje się listą tokenów. Potem listą numerów, na przykład w stylu dwóch ID. Następnie każdy numer zamienia się w wektor. Dopiero wtedy sieć transformerowa liczy kolejne kroki odpowiedzi.", "remember": "Tekst → tokeny → ID → wektory → transformer.", "wrong": {"A": "Kolejność jest odwrócona. Tekst i tokenizacja są na początku, embedding później.", "B": "To nie jest opisany pipeline wejścia. UNKNOWN dotyczy problemu słownika słów, nie kolejności całego modelu.", "C": "Parametry, RAG, Ollama i scraper to inne elementy ekosystemu, nie ścieżka tokenizacji tekstu."}}}, {"n": 16, "category": "Agentic AI", "difficulty": "trudne", "text": "Co technicznie oznacza autonomia agenta opartego na LLM?", "options": {"A": "Model uzyskuje własną wolę i działa poza systemem", "B": "Model wybiera następny krok, system wykonuje narzędzie, a wynik wraca do kolejnego wywołania", "C": "Jedno wywołanie modelu zawsze kończy całe wieloetapowe zadanie", "D": "Agent nie potrzebuje kontekstu ani narzędzi"}, "correct": "B", "why": "Autonomia agenta to pętla: decyzja modelu, wykonanie narzędzia, wynik wraca do kolejnego wywołania.", "lesson": {"correct": "Agent używa LLM jako elementu sterującego workflow. Model wskazuje kolejny krok. System wykonuje narzędzie. Wynik wraca do modelu jako nowy kontekst. To pętla decyzji i działań. Typową pomyłką jest przypisywanie temu „własnej woli”.", "example": "Użytkownik prosi o rezerwację restauracji. Model wybiera wyszukiwarkę, potem sprawdzenie terminów, potem funkcję rezerwacji. Po każdym kroku wynik wraca i model decyduje dalej.", "remember": "Agent = decyzja, narzędzie, wynik, kolejna decyzja.", "wrong": {"A": "Autonomia jest tu pojęciem technicznym, nie świadomością ani wolną wolą.", "C": "Wieloetapowe zadanie zwykle wymaga kilku wywołań i wyników narzędzi.", "D": "Kontekst i narzędzia są kluczowymi elementami systemu agentowego."}}}, {"n": 17, "category": "LLM", "difficulty": "trudne", "text": "Dlaczego wykład podkreśla, że tokenizacja nie jest fundamentalnym prawem modeli językowych?", "options": {"A": "Bo teoretycznie da się budować modele znakowe, słowowe lub tokenowe, a tokeny wygrały jako praktyczny kompromis", "B": "Bo modele nie mogą działać bez dokładnie jednego tokenu na literę", "C": "Bo embeddingi zastąpiły całkowicie potrzebę jakiegokolwiek wejścia tekstowego", "D": "Bo każde API wymaga wyłącznie słowników opartych na całych zdaniach"}, "correct": "A", "why": "Modele można budować znakowo, słowowo lub tokenowo; tokeny wygrały jako praktyczny kompromis.", "lesson": {"correct": "Nie ma prawa fizyki, które każe LLM używać tokenów. Da się myśleć o modelach znakowych albo słowowych. Tokenizacja wygrała, bo dobrze działa w praktyce. Łączy mały słownik z elastycznością. Typową pomyłką jest uznanie tokenów za jedyną możliwą naturę języka dla maszyn.", "example": "Zespół może spróbować uczyć model na literach. Inny zespół może używać całych słów. Trzeci wybiera tokeny-fragmenty. Współczesne LLM-y najczęściej idą trzecią drogą, bo daje dobry balans kosztu i jakości.", "remember": "Tokeny wygrały praktyką, nie kosmicznym obowiązkiem.", "wrong": {"B": "To wręcz przeczy notatkom: token nie musi być jedną literą.", "C": "Embeddingi powstają z token ID; nie usuwają potrzeby wejścia tekstowego.", "D": "API nie wymaga słowników całych zdań jako jedynej opcji. Tokenizacja jest kompromisem."}}}, {"n": 18, "category": "LLM", "difficulty": "łatwe", "text": "Czym są parametry modelu językowego?", "options": {"A": "Osobnymi rekordami, z których każdy przechowuje jeden fakt", "B": "Tokenami znajdującymi się aktualnie w oknie kontekstu", "C": "Instrukcjami zapisanymi przez użytkownika w prompcie", "D": "Liczbami uczonymi podczas treningu, które wspólnie reprezentują wzorce"}, "correct": "D", "why": "Parametry to liczby uczone podczas treningu, które wspólnie reprezentują wzorce.", "lesson": {"correct": "Parametry to liczby ustawiane podczas treningu. Działają razem jak ogromny zestaw pokręteł. Wiedza nie siedzi zwykle w jednej szufladce „jeden parametr = jeden fakt”. Jest rozproszona między wieloma wartościami. Typową pomyłką jest mylenie parametrów z promptem albo z tokenami wejścia.", "example": "Wyobraź sobie tablicę z milionami małych pokręteł. Jedno pokrętło nie oznacza „Warszawa jest stolicą”. Dopiero wspólne ustawienie wielu pokręteł wpływa na to, jakie kolejne tokeny model uzna za prawdopodobne.", "remember": "Parametr to pokrętło we wspólnej maszynie, nie pojedyncza karteczka z faktem.", "wrong": {"A": "Wiedza modelu jest rozproszona; nie ma prostego przypisania jednego faktu do jednej liczby.", "B": "Token jest elementem tekstu na wejściu lub wyjściu, a parametr jest wyuczoną wartością wewnątrz modelu.", "C": "Prompt dostarcza bieżące instrukcje i kontekst, ale nie jest zbiorem wartości wyuczonych w treningu."}}}, {"n": 19, "category": "LLM", "difficulty": "średnie", "text": "Dlaczego tokenizacja ma znaczenie praktyczne poza samym podziałem tekstu?", "options": {"A": "Bo usuwa konieczność okna kontekstu", "B": "Bo gwarantuje, że każde słowo kosztuje dokładnie jeden grosz", "C": "Bo wpływa na długość promptu, limit kontekstu, koszt i szybkość przetwarzania", "D": "Bo zastępuje potrzebę User-Agent przy scrapingu"}, "correct": "C", "why": "Tokeny wpływają na długość promptu, limit kontekstu, koszt i szybkość przetwarzania.", "lesson": {"correct": "Model rozlicza i przetwarza tekst jako tokeny. Dłuższy prompt w tokenach zajmie więcej okna kontekstu. Często też więcej kosztuje. Więcej tokenów to zwykle więcej pracy przy generowaniu. Dlatego tokenizacja to nie tylko teoria podziału tekstu. Typową pomyłką jest ignorowanie tokenów przy planowaniu kosztu i limitu.", "example": "Surowy HTML ze zbędną nawigacją może zająć setki tokenów bez wartości. Po oczyszczeniu ten sam sens mieści się w krótszym wejściu. Oszczędzasz limit kontekstu, pieniądze i czas odpowiedzi.", "remember": "Tokeny rządzą limitem, kosztem i tempem — nie tylko podziałem tekstu.", "wrong": {"A": "Okno kontekstu nadal istnieje i jest liczone właśnie w tokenach.", "B": "Koszt zależy od liczby tokenów i cennika, a nie od stałej ceny „jedno słowo = jeden grosz”.", "D": "User-Agent dotyczy pobierania stron WWW i nie jest zastępowany przez tokenizację."}}}, {"n": 20, "category": "Web scraping", "difficulty": "trudne", "text": "Scraper zwraca pusty tekst ze strony renderowanej przez JavaScript. Co jest najbezpieczniejszym zachowaniem przed wywołaniem LLM?", "options": {"A": "Przerwać przetwarzanie lub użyć narzędzia renderującego stronę, zamiast wymuszać streszczenie", "B": "Wysłać pusty prompt i poprosić model o odtworzenie strony", "C": "Zwiększyć liczbę parametrów modelu", "D": "Usunąć walidację URL, aby pobrać więcej treści"}, "correct": "A", "why": "Przy pustej treści lepiej przerwać lub użyć renderowania zamiast pozwalać modelowi zgadywać.", "lesson": {"correct": "Zwykłe pobranie HTML może nie zobaczyć treści tworzonej później przez JavaScript. Pusty wynik trzeba wykryć przed promptem. Można przerwać działanie albo użyć narzędzia renderującego stronę. Bez danych model łatwo zaczyna zgadywać. Typową pomyłką jest proszenie o streszczenie materiału, którego nie ma.", "example": "Strona sklepu pokazuje produkty dopiero po skryptach w przeglądarce. Prosty scraper dostaje pusty szkielet. Wysłanie tego do LLM zachęca do halucynacji zamiast streszczania. Bezpieczniej jest zatrzymać pipeline albo użyć renderowania.", "remember": "Brak treści = stop, nie zaproszenie do zgadywania.", "wrong": {"B": "Model nie odtworzy wiernie strony, której treści nie dostał.", "C": "Większy model nadal nie ma brakujących danych ze strony.", "D": "Walidacja URL chroni przed błędnymi adresami i nie rozwiązuje problemu JavaScript."}}}];
const quiz=document.querySelector("#quiz");
const letters=["A","B","C","D"];
const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
questions.forEach(question=>{
const article=document.createElement("article");
article.className="question";
article.id=`question-${question.n}`;
const options=letters.map(letter=>`<label class="option"><input type="radio" name="q${question.n}" value="${letter}"><strong>${letter}.</strong><span>${escapeHtml(question.options[letter])}</span></label>`).join("");
article.innerHTML=`<div class="meta"><span class="tag">${escapeHtml(question.category)}</span><span class="tag difficulty">${escapeHtml(question.difficulty)}</span></div><h2>${question.n}. ${escapeHtml(question.text)}</h2><div class="options">${options}<label class="option unknown"><input type="radio" name="q${question.n}" value="?"><strong>?</strong><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="confidence${question.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" aria-live="polite"></div>`;
quiz.appendChild(article);
});
let lastResults=null;
const selectedAnswer=n=>document.querySelector(`input[name="q${n}"]:checked`)?.value||"";
const confidence=n=>document.querySelector(`select[name="confidence${n}"]`).value;
const lessonBlock=(question,chosen)=>{
const wrong=chosen==="?"?"":`<div class="lesson-part"><strong>Twoja odpowiedź</strong>${escapeHtml(question.lesson.wrong[chosen])}</div>`;
const intro=chosen==="?"?"<p>Bez zgadywania — oto spokojne wyjaśnienie.</p>":"";
return `${intro}${wrong}<div class="lesson-part"><strong>Poprawna myśl</strong>${escapeHtml(question.lesson.correct)}</div><div class="lesson-part"><strong>Przykład</strong>${escapeHtml(question.lesson.example)}</div><div class="lesson-part"><strong>Zapamiętaj</strong>${escapeHtml(question.lesson.remember)}</div>`;
};
document.querySelector("#check").addEventListener("click",()=>{
const missing=questions.filter(question=>!selectedAnswer(question.n));
document.querySelectorAll(".question").forEach(element=>element.classList.remove("missing"));
if(missing.length){
missing.forEach(question=>document.querySelector(`#question-${question.n}`).classList.add("missing"));
document.querySelector(`#question-${missing[0].n}`).scrollIntoView({behavior:"smooth",block:"center"});
alert(`Uzupełnij odpowiedź A–D albo „Nie mam pojęcia” w ${missing.length} pytaniach.`);
return;
}
let score=0;
let unknown=0;
lastResults=questions.map(question=>{
const chosen=selectedAnswer(question.n);
const feedback=document.querySelector(`#question-${question.n} .feedback`);
feedback.className="feedback show";
if(chosen===question.correct){
score++;
feedback.classList.add("ok");
feedback.innerHTML=`<h3>OK · ${question.correct}</h3><p>${escapeHtml(question.why)}</p>`;
return{question,chosen,status:"OK",confidence:confidence(question.n)};
}
if(chosen==="?"){
unknown++;
feedback.classList.add("learn");
feedback.innerHTML=`<h3>NIE WIEM · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"NIE WIEM",confidence:confidence(question.n)};
}
feedback.classList.add("bad");
feedback.innerHTML=`<h3>BŁĄD · Twoja: ${chosen} · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"BŁĄD",confidence:confidence(question.n)};
});
const percent=Math.round(score/questions.length*100);
const summary=document.querySelector("#summary");
summary.className="show";
summary.innerHTML=`<strong>Wynik: ${score}/20 · ${percent}%</strong><br>Nie wiem: ${unknown}<p class="small">Przeczytaj krótkie wyjaśnienia oraz mini-lekcje pod pytaniami oznaczonymi BŁĄD lub NIE WIEM.</p>`;
document.querySelector("#downloadResults").disabled=false;
summary.scrollIntoView({behavior:"smooth",block:"start"});
});
const tableRow=result=>`| ${result.question.n} | ${result.chosen||""} | ${result.confidence||""} |  |`;
const download=(filename,content)=>{
const blob=new Blob([content],{type:"text/markdown;charset=utf-8"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=filename;
link.click();
URL.revokeObjectURL(link.href);
};
document.querySelector("#downloadAnswers").addEventListener("click",()=>{
const rows=questions.map(question=>tableRow({question,chosen:selectedAnswer(question.n),confidence:confidence(question.n)})).join("\n");
download("28.09.2026_my_answers.md",`# Moje odpowiedzi – 28.09.2026\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---:|:---:|:---:|---|\n${rows}\n\n## Notatki\n`);
});
document.querySelector("#downloadResults").addEventListener("click",()=>{
if(!lastResults)return;
const score=lastResults.filter(result=>result.status==="OK").length;
const unknown=lastResults.filter(result=>result.status==="NIE WIEM").length;
const percent=Math.round(score/questions.length*100);
const detail=lastResults.map(result=>`| ${result.question.n} | ${result.chosen} | ${result.question.correct} | ${result.status} | ${result.confidence||""} | ${result.question.why.replace(/\|/g,"\\|")} |`).join("\n");
const strong=[...new Set(lastResults.filter(result=>result.status==="OK").map(result=>result.question.category))];
const repeat=[...new Set(lastResults.filter(result=>result.status!=="OK").map(result=>result.question.category))];
const strongText=strong.length?strong.map(value=>`- ${value}`).join("\n"):"- Brak kategorii z poprawną odpowiedzią.";
const repeatText=repeat.length?repeat.map(value=>`- ${value}`).join("\n"):"- Brak — wszystkie odpowiedzi są poprawne.";
download("28.09.2026_results.md",`# Wynik quizu — 28.09.2026\n\n## Wynik\n\n${score}/20 · ${percent}%\n\nNie wiem: ${unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---:|:---:|:---:|:---:|:---:|---|\n${detail}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${repeatText}\n`);
});
</script>
</body>
</html>
