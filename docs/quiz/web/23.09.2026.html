<style>

* { box-sizing: border-box; }

.q-text { font-size: 1.05rem; margin: 6px 0 12px; }
.options label {

  padding: 4px 8px;

  margin-top: 12px;
  padding: 10px 12px;
  border-left: 3px solid var(--accent);
  background: rgba(255,255,255,0.7);
  font-size: 0.92rem;
  display: none;

.q.checked .why { display: block; }
.verdict {
  font-family: var(--mono);
  font-size: 0.85rem;
  font-weight: 600;
  margin-left: auto;

.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }

  position: sticky;
  bottom: 0;
  margin-top: 24px;
  padding: 14px;
  background: rgba(255,255,255,0.92);

button {

.btn-primary { background: var(--accent); color: #fff; }

.btn-secondary { background: #eef3f1; color: var(--ink); border: 1px solid var(--border); }

</style>

czego służy rola `system` w messages?", "A": "Ustawia globalne instrukcje (ton, format, język) dla modelu", "B": "Przechowuje wyłącznie poprzednie odpowiedzi asystenta", "C": "Jest zarezerwowana tylko dla modeli reasoningowych", "D": "Zastępuje konieczność podawania `model` w żądaniu", "correct": "A", "why": "Rola `system` ustawia globalne instrukcje: ton, format, język odpowiedzi."}, {"n": 11, "cat": "API", "diff": "średnie", "text": "Jak inżynier AI tworzy iluzję, że model „pamięta\" rozmowę?", "A": "Przez wyłączenie rozliczania tokenów wejściowych", "B": "Przez używanie wyłącznie roli `system` bez `user`", "C": "Przez przekazywanie całej dotychczasowej historii w `messages` przy każdym wywołaniu", "D": "Przez jednorazowe fine-tuning wag przy każdej turze", "correct": "C", "why": "Iluzja pamięci powstaje przez przekazywanie całej historii rozmowy w każdej liście `messages`."}, {"n": 12, "cat": "Python", "diff": "średnie", "text": "Które elementy HTML warto usunąć metodą `decompose()` przed ekstrakcją tekstu dla modelu?", "A": "Wyłącznie tagi `h1` i `p`", "B": "m.in. `script`, `style`, `img`, `input` (oraz podobne bez wartości merytorycznej)", "C": "Wyłącznie atrybuty `href` bez usuwania tagów", "D": "Tylko komentarze HTML, zostawiając JavaScript", "correct": "B", "why": "Przed ekstrakcją usuwa się elementy bez treści merytorycznej, m.in. `script`, `style`, `img`, `input`."}, {"n": 13, "cat": "API", "diff": "średnie", "text": "Po co w historii konwersacji umieszcza się wiadomości z rolą `assistant`?", "A": "Aby uniknąć kosztów tokenów wyjściowych", "B": "Aby wymusić tryb reasoning bez limitu czasu", "C": "Aby zastąpić wiadomość `system` w kolejnych turach", "D": "Aby przekazać modelowi jego wcześniejsze odpowiedzi jako część kontekstu", "correct": "D", "why": "Rola `assistant` wstawia wcześniejsze odpowiedzi modelu do kontekstu kolejnych tur."}, {"n": 14, "cat": "API", "diff": "trudne", "text": "Co oznacza „OpenAI Compatible Endpoint\" u innego dostawcy?", "A": "Endpoint o strukturze żądań/odpowiedzi jak Chat Completions — ten sam klient SDK działa po zmianie `base_url` i klucza", "B": "Endpoint, który działa wyłącznie z wagami modeli OpenAI", "C": "Endpoint wymagający ręcznego JSON bez możliwości użycia SDK", "D": "Endpoint dostępny tylko lokalnie i nigdy w chmurze", "correct": "A", "why": "Compatible endpoint ma strukturę jak Chat Completions; ten sam SDK działa po zmianie `base_url` i klucza."}, {"n": 15, "cat": "LLM", "diff": "średnie", "text": "Co głównie robi LLM podczas generowania odpowiedzi?", "A": "Odtwarza dosłownie ostatni dokument ze scrapingu", "B": "Przewiduje najbardziej prawdopodobne kolejne tokeny w sekwencji", "C": "Wykonuje SQL na bazie wektorowej zamiast generować tekst", "D": "Zawsze losuje tokeny z równym prawdopodobieństwem", "correct": "B", "why": "LLM przewiduje najbardziej prawdopodobne kolejne tokeny w sekwencji."}, {"n": 16, "cat": "LLM", "diff": "trudne", "text": "Jaka jest ważna pułapka modeli reasoningowych bez limitu budżetu myślenia?", "A": "Nie potrafią odpowiadać w formacie chat", "B": "Zawsze są tańsze per token niż modele chatowe", "C": "Mogą odpowiadać znacznie dłużej — latency i UX mocno rosną", "D": "Nie działają przez Chat Completions API", "correct": "C", "why": "Bez limitu budżetu myślenia model reasoningowy może odpowiadać znacznie dłużej (latency, UX)."}, {"n": 17, "cat": "API", "diff": "trudne", "text": "Dlaczego przy długiej rozmowie koszt API rośnie z każdą turą, nawet gdy nowe pytanie jest krótkie?", "A": "Bo przy każdej turze ponownie rozliczana jest (prawie) cała dotychczasowa historia wejściowa", "B": "Bo API zawsze dolicza stałą opłatę niezależną od tokenów", "C": "Bo rola `assistant` jest darmowa, a `user` podwójnie płatna", "D": "Bo tiktoken automatycznie podwaja liczbę tokenów co turę", "correct": "A", "why": "Każda tura ponownie rozlicza dotychczasową historię wejściową — krótke pytanie nie zeruje kosztu kontekstu."}, {"n": 18, "cat": "GenAI", "diff": "trudne", "text": "Jaki efekt ma proste obcięcie tekstu strony od początku do limitu znaków przed wysłaniem do modelu?", "A": "Automatycznie buduje bazę wektorową z końcówki dokumentu", "B": "Zwiększa okno kontekstu lokalnego modelu", "C": "Gwarantuje, że model dostanie wyłącznie nagłówki HTML", "D": "Końcówka długiego artykułu ginie — do modelu trafia tylko początek", "correct": "D", "why": "Obcięcie od początku powoduje utratę końcówki długiego artykułu."}, {"n": 19, "cat": "API", "diff": "trudne", "text": "Jak produkty typu ChatGPT tworzą wrażenie ciągłej pamięci rozmowy?", "A": "Przez przechowywanie stanu rozmowy wewnątrz wag modelu między sesjami użytkownika", "B": "Przez wysyłanie przy każdej wiadomości pełnej dotychczasowej konwersacji w wejściu", "C": "Przez wyłączenie bezstanowości na poziomie protokołu HTTP", "D": "Przez jednorazowe wywołanie bez kolejnych requestów", "correct": "B", "why": "ChatGPT przy każdej wiadomości przekazuje pełną dotychczasową konwersację jako wejście."}, {"n": 20, "cat": "RAG", "diff": "trudne", "text": "Dlaczego embeddings i baza wektorowa pomagają przy ograniczonym oknie kontekstu?", "A": "Bo zwiększają limit tokenów modelu w API bez zmian po stronie dostawcy", "B": "Bo zastępują całkowicie potrzebę promptu systemowego", "C": "Bo pozwalają dołączyć do promptu tylko najbardziej podobne / istotne fragmenty zamiast całego dokumentu", "D": "Bo eliminują konieczność tokenizacji tekstu wejściowego", "correct": "C", "why": "Embeddings + baza wektorowa pozwalają dołączyć do promptu tylko istotne fragmenty dokumentu."}];

const root = document.getElementById("quiz");
QUIZ.forEach(q => {
  const el = document.createElement("article");
  el.className = "q";
  el.dataset.n = q.n;
  el.innerHTML = `
    <div class="q-head">
      <span class="q-num">#${q.n}</span>
      <span class="tag">[${q.cat}]</span>
      <span class="tag diff-${q.diff}">[${q.diff}]</span>
      <span class="verdict" id="v-${q.n}"></span>
    </div>
    <div class="q-text">${escapeHtml(q.text)}</div>
    <div class="options">
      ${["A","B","C","D"].map(L => `
        <label><input type="radio" name="q${q.n}" value="${L}" /> <span><strong>${L})</strong> ${escapeHtml(q[L])}</span></label>
      `).join("")}
    </div>
    <div class="confidence">
      <label>Pewność:
        <select id="c-${q.n}">
          <option value="">—</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </label>
    </div>
    <div class="why" id="w-${q.n}"></div>
  `;
  root.appendChild(el);
});

function escapeHtml(s) {
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function getAnswers() {
  return QUIZ.map(q => {
    const checked = document.querySelector(`input[name="q${q.n}"]:checked`);
    const conf = document.getElementById(`c-${q.n}`).value;
    return {
      n: q.n,
      yours: checked ? checked.value : "",
      conf,
      correct: q.correct,
      why: q.why,
      cat: q.cat,
      ok: checked ? checked.value === q.correct : false
    };
  });
}

document.getElementById("checkBtn").addEventListener("click", () => {
  const rows = getAnswers();
  const answered = rows.filter(r => r.yours).length;
  if (answered < 20) {
    if (!confirm(`Odpowiedziano na ${answered}/20. Sprawdzić mimo to?`)) return;
  }
  let score = 0;
  const strong = [];
  const weak = [];
  rows.forEach(r => {
    const card = document.querySelector(`.q[data-n="${r.n}"]`);
    card.classList.add("checked");
    card.classList.remove("ok","bad");
    const v = document.getElementById(`v-${r.n}`);
    const w = document.getElementById(`w-${r.n}`);
    if (r.yours && r.ok) {
      score++;
      card.classList.add("ok");
      v.textContent = "OK";
      v.className = "verdict ok";
      strong.push(r.cat);
    } else {
      card.classList.add("bad");
      v.textContent = "BŁĄD";
      v.className = "verdict bad";
      weak.push(r.cat);
    }
    w.innerHTML = `<strong>Poprawna:</strong> ${r.correct}. ${escapeHtml(r.why)}`;
  });
  const pct = Math.round((score/20)*100);
  const scoreEl = document.getElementById("score");
  scoreEl.className = "show";
  scoreEl.textContent = `Wynik: ${score}/20 (${pct}%)`;
  document.getElementById("dlAnswers").disabled = false;
  document.getElementById("dlResults").disabled = false;
  window.__last = { rows, score, pct, strong, weak };
});

function download(filename, text) {
  const blob = new Blob([text], {type: "text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById("dlAnswers").addEventListener("click", () => {
  const rows = (window.__last && window.__last.rows) || getAnswers();
  let md = `# Moje odpowiedzi – ${DATE}\n\n`;
  md += `| # | Twoja odpowiedź (A/B/C/D) | Pewność (1-5) | Uwagi |\n`;
  md += `|---|---------------------------|---------------|-------|\n`;
  rows.forEach(r => {
    md += `| ${r.n} | ${r.yours || ""} | ${r.conf || ""} |  |\n`;
  });
  md += `\n## Notatki\n`;
  download(`${DATE}_my_answers.md`, md);
});

document.getElementById("dlResults").addEventListener("click", () => {
  if (!window.__last) return;
  const { rows, score, pct, strong, weak } = window.__last;
  const uniq = arr => [...new Set(arr)];
  let md = `# Wynik quizu — ${DATE}\n\n`;
  md += `## Wynik\n\n`;
  md += `- **${score}/20**\n`;
  md += `- **${pct}%**\n\n`;
  md += `## Szczegóły\n\n`;
  md += `| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n`;
  md += `|---|-----------------|--------------------|-------|---------|-----------|\n`;
  rows.forEach(r => {
    const wynik = r.yours ? (r.ok ? "OK" : "BŁĄD") : "BRAK";
    md += `| ${r.n} | ${r.yours || "—"} | ${r.correct} | ${wynik} | ${r.conf || "—"} | ${r.why} |\n`;
  });
  md += `\n## Mocne strony\n\n`;
  md += uniq(strong).length ? uniq(strong).map(c => `- ${c}`).join("\n") : "- Brak poprawnych odpowiedzi w tej sesji.";
  md += `\n\n## Obszary do powtórki\n\n`;
  md += uniq(weak).length ? uniq(weak).map(c => `- ${c}`).join("\n") : "- Brak błędów — świetna robota.";
  md += `\n`;
  download(`${DATE}_results.md`, md);
});
</script>
</body>
