<script>
const questions=[{"n": 1, "category": "LLM", "difficulty": "łatwe", "text": "Czym jest context window (okno kontekstowe) modelu językowego?", "options": {"A": "Maksymalna liczba tokenów, które model może uwzględnić podczas generowania kolejnych tokenów", "B": "Liczba warstw sieci neuronowej w modelu", "C": "Maksymalna liczba znaków w odpowiedzi widocznej dla użytkownika", "D": "Limit liczby równoległych użytkowników API"}, "correct": "A", "why": "Context window to limit tokenów, które model może wziąć pod uwagę przy generowaniu kolejnych tokenów.", "lesson": {"correct": "Context window to jak wielkość biurka modelu. Na biurko możesz położyć tylko tyle kartek (tokenów), ile się zmieści. Model generuje kolejną odpowiedź, patrząc na to, co jest na biurku. Jeśli wrzucisz za dużo tekstu, część się nie zmieści albo wejście nie będzie poprawnie obsłużone. To nie jest liczba warstw ani liczba użytkowników. Typową pomyłką jest mylenie limitu tokenów z limitem znaków odpowiedzi.", "example": "Wyobraź sobie biurko na 100 tysięcy tokenów. System prompt, historia czatu i dokumenty RAG muszą się razem zmieścić. Jeśli historia ma już 90 tysięcy tokenów, na nowe pytanie i dokumenty zostaje mało miejsca. Dlatego inżynier pilnuje rozmiaru wejścia.", "remember": "Context window = ile tokenów model może mieć naraz na biurku.", "wrong": {"B": "Liczba warstw to architektura modelu, nie okno kontekstowe. Context window mówi o limicie wejścia w tokenach.", "C": "Limit dotyczy też wejścia i całej sekwencji, nie tylko widocznej odpowiedzi użytkownika.", "D": "To nie jest limit równoległych użytkowników. Chodzi o rozmiar kontekstu jednego wywołania."}}}, {"n": 2, "category": "Narzędzia", "difficulty": "łatwe", "text": "Na jakim porcie domyślnie nasłuchuje lokalny serwer Ollama?", "options": {"A": "3000", "B": "8080", "C": "5000", "D": "11434"}, "correct": "D", "why": "Ollama domyślnie nasłuchuje na porcie 11434.", "lesson": {"correct": "Ollama uruchamia lokalny serwer HTTP. Domyślny port to 11434. Tam sprawdzasz połączenie i tam kierujesz klienta API. Zły port daje błąd nawet przy dobrym prompcie. To nie port frontendu. Typową pomyłką jest mylenie z 3000 albo 8080.", "example": "Ustawiasz adres na localhost z portem 11434 i ścieżką /v1. Jeśli serwer działa, możesz wysłać Chat Completions do lokalnego modelu. Port 3000 tu nie pomoże.", "remember": "Ollama = port 11434.", "wrong": {"A": "3000 często kojarzy się z frontendem, nie z Ollamą.", "B": "8080 bywa używany przez inne aplikacje, ale nie jest domyślnym portem Ollamy.", "C": "5000 to też inny popularny port usług — nie domyślny Ollamy."}}}, {"n": 3, "category": "API", "difficulty": "łatwe", "text": "Jak zazwyczaj rozliczane jest korzystanie z API modeli w odróżnieniu od subskrypcji aplikacji typu ChatGPT?", "options": {"A": "API zawsze jest darmowe, a aplikacja zawsze płatna miesięcznie", "B": "API zwykle działa w modelu pay per use — płacisz za faktyczne użycie tokenów", "C": "API rozlicza wyłącznie liczbę kliknięć w interfejsie", "D": "API i aplikacja mają zawsze identyczny abonament miesięczny"}, "correct": "B", "why": "Aplikacje bywają w subskrypcjach, a API zwykle rozlicza się pay per use za faktyczne użycie tokenów.", "lesson": {"correct": "Chat w aplikacji może mieć plan Free, Plus albo Pro. API działa inaczej: zwykle płacisz za to, ile tokenów naprawdę użyjesz. To nazywa się pay per use. Wysyłasz dużo tekstu albo dostajesz długą odpowiedź — płacisz więcej. Małe eksperymenty bywają bardzo tanie. Typową pomyłką jest myślenie, że API zawsze ma ten sam abonament co aplikacja.", "example": "W aplikacji masz miesięczny plan. W API wysyłasz krótkie pytanie za kilkadziesiąt tokenów i dostajesz krótką odpowiedź. Koszt może być ułamkiem grosza. Przy tysiącach użytkowników suma szybko rośnie.", "remember": "Aplikacja = często abonament; API = zwykle pay per use za tokeny.", "wrong": {"A": "API nie jest zawsze darmowe; zwykle płacisz za użycie. Aplikacja też może mieć darmowy plan.", "C": "Rozliczenie API dotyczy tokenów wejścia i wyjścia, nie kliknięć w UI.", "D": "Modele rozliczeń bywają różne — API zwykle nie jest tym samym abonamentem co aplikacja."}}}, {"n": 4, "category": "Python", "difficulty": "łatwe", "text": "Dlaczego przed wysłaniem treści strony do LLM czyści się HTML (np. usuwa skrypty i nawigację)?", "options": {"A": "Bo model potrafi czytać tylko obrazy PNG", "B": "Bo tokenizer wymaga wyłącznie pustego tekstu", "C": "Bo zbędny markup marnuje tokeny i okno kontekstu bez wartości merytorycznej", "D": "Bo API odrzuca każde zdanie dłuższe niż trzy słowa"}, "correct": "C", "why": "Surowy HTML i nawigacja zużywają tokeny bez wartości merytorycznej — warto czyścić treść przed promptem.", "lesson": {"correct": "Strona WWW ma dużo „śmieci”: menu, skrypty, style. Modelowi potrzebna jest treść merytoryczna. Jeśli wrzucisz cały HTML, zużyjesz tokeny i miejsce w context window na rzeczy bezużyteczne. Czyszczenie tekstu to oszczędność i lepszy prompt. Typową pomyłką jest myślenie, że model „i tak ogarnie HTML za darmo”.", "example": "Artykuł ma 800 słów treści, ale surowy HTML ma też 4000 znaków menu i skryptów. Po wyczyszczeniu wysyłasz głównie artykuł. Prompt jest krótszy, tańszy i bardziej skupiony.", "remember": "Czysta treść = mniej tokenów i lepszy kontekst.", "wrong": {"A": "Tu chodzi o tekst strony; nie o wymóg PNG.", "B": "Tokenizer nie wymaga pustego tekstu — wymaga sensownego wejścia.", "D": "Nie ma takiej reguły o trzech słowach."}}}, {"n": 5, "category": "LLM", "difficulty": "średnie", "text": "Co oprócz najnowszej wiadomości użytkownika może zajmować miejsce w context window?", "options": {"A": "Wyłącznie liczba warstw modelu", "B": "Tylko klucz API zapisany w .env", "C": "Tylko nazwa modelu w cenniku", "D": "System prompt, historia rozmowy, few-shot, dokumenty RAG i wyniki narzędzi"}, "correct": "D", "why": "Do kontekstu wchodzi cała sekwencja wejściowa: system, historia, few-shot, RAG, narzędzia — nie tylko ostatnia wiadomość.", "lesson": {"correct": "Context window to nie „ostatnie zdanie użytkownika”. To całe wejście naraz. System mówi, jak się zachować. Historia przypomina wcześniejszą rozmowę. Few-shot daje przykłady. RAG dokłada dokumenty. Narzędzia dokładają wyniki. Wszystko to zajmuje tokeny. Typową pomyłką jest liczenie tylko najnowszego pytania.", "example": "Masz 2 tysiące tokenów instrukcji systemowych, 5 tysięcy historii, 3 tysiące dokumentów RAG i krótkie pytanie. Limit zużywa głównie to, co było przed pytaniem. Nowe pytanie to tylko mały kawałek.", "remember": "W kontekście liczy się cała sekwencja wejściowa, nie tylko ostatni prompt.", "wrong": {"A": "Liczba warstw nie zajmuje context window użytkownika.", "B": "Klucz API jest w konfiguracji klienta, nie w oknie kontekstowym modelu.", "C": "Nazwa modelu w cenniku nie wypełnia kontekstu wywołania."}}}, {"n": 6, "category": "LLM", "difficulty": "średnie", "text": "Jaka jest orientacyjna reguła łącząca tokeny ze słowami dla typowego tekstu angielskiego?", "options": {"A": "1 token ≈ 0,75 słowa", "B": "1 token ≈ 10 słów", "C": "1 token ≈ 40 słów", "D": "1 token ≈ dokładnie 1 znak"}, "correct": "A", "why": "Orientacyjnie 1 token ≈ 0,75 słowa, więc 1000 tokenów ≈ 750 słów.", "lesson": {"correct": "To popularne przybliżenie, nie prawo fizyki. Pomaga szybko wyczuć skalę tekstu. Najlepiej działa dla zwykłego angielskiego. Dla kodu czy innych języków bywa gorzej. Typową pomyłką jest traktowanie reguły jak dokładnego licznika.", "example": "1000 tokenów ≈ 750 słów. Milion tokenów ≈ około 750 000 słów. Dzięki temu cennik „za 1M tokenów” nabiera ludzkiej skali.", "remember": "Na szybko: 1 token ≈ 0,75 słowa w typowym angielskim.", "wrong": {"B": "10 słów na token mocno zawyża objętość względem reguły 0,75.", "C": "40 słów na token jest jeszcze bardziej niedopasowane.", "D": "Jeden znak na token to inne podejście; reguła słów to ≈ 0,75."}}}, {"n": 7, "category": "LLM", "difficulty": "średnie", "text": "Jak RAG wpływa na context window i koszt wejścia?", "options": {"A": "RAG usuwa potrzebę tokenów wejściowych", "B": "RAG zawsze zmniejsza context window modelu", "C": "Dodane dokumenty zwiększają wejście — poprawiają odpowiedź, ale zużywają okno kontekstowe i koszt input tokens", "D": "RAG rozlicza wyłącznie output tokens, nigdy input"}, "correct": "C", "why": "Dokumenty RAG dokładane do promptu zwiększają input, zużywają context window i podnoszą koszt wejścia.", "lesson": {"correct": "RAG wyszukuje dokumenty i dokłada je do wejścia modelu. Dzięki temu model ma świeże fakty. Ale każdy dokument to dodatkowe tokeny. Większe wejście zajmuje context window i zwykle drożej kosztuje. Trzeba wybierać najważniejsze fragmenty, nie wrzucać wszystkiego. Typową pomyłką jest myślenie, że RAG jest „za darmo względem kontekstu”.", "example": "Pytanie ma 50 tokenów. Trzy dokumenty mają po 800 tokenów. Wejście nagle ma ponad 2400 tokenów. Odpowiedź może być lepsza, ale płacisz za większy input i zajmujesz więcej okna.", "remember": "RAG pomaga jakością, ale zjada kontekst i input tokens.", "wrong": {"A": "RAG właśnie dodaje treść do wejścia — nie usuwa tokenów.", "B": "RAG nie zmienia limitu modelu; zużywa część dostępnego limitu.", "D": "Dokumenty RAG to głównie koszt i zużycie input tokens."}}}, {"n": 8, "category": "API", "difficulty": "łatwe", "text": "Do czego służy wiadomość z rolą system w liście messages?", "options": {"A": "Do przechowywania klucza API w prompcie", "B": "Do ustawienia instrukcji określających zachowanie, ton i reguły modelu", "C": "Do pobierania HTML ze strony WWW", "D": "Do reprezentowania poprzedniej odpowiedzi użytkownika"}, "correct": "B", "why": "Rola system ustawia globalne instrukcje zachowania, tonu i reguł odpowiedzi.", "lesson": {"correct": "Wiadomość system mówi modelowi, jak ma się zachować. To reguły gry: język, ton, format, ograniczenia. User zwykle przynosi konkretne pytanie albo dane. Assistant to wcześniejsze odpowiedzi modelu. Typową pomyłką jest chowanie sekretów technicznych w roli system.", "example": "System: „Jesteś pomocnym asystentem”. User: „Hi! I'm Ed!”. Model odpowiada w ramach tych reguł. Przy follow-upie system zwykle zostaje w historii razem z resztą rozmowy.", "remember": "System = zasady gry; user = zadanie; assistant = wcześniejsza odpowiedź modelu.", "wrong": {"A": "Klucz API należy do konfiguracji klienta, nie do promptu.", "C": "Pobieranie HTML robi kod scrapujący przed wywołaniem modelu.", "D": "Pytanie użytkownika ma rolę user."}}}, {"n": 9, "category": "API", "difficulty": "średnie", "text": "W jaki sposób caching może obniżyć koszty API?", "options": {"A": "Gdy ten sam lub bardzo podobny początek wejścia wraca wielokrotnie, część pracy może być wykorzystana ponownie i koszt input tokens może spaść", "B": "Caching zawsze kasuje output tokens do zera", "C": "Caching zwiększa context window modelu o milion tokenów", "D": "Caching zamienia każdy model reasoningowy w darmowy model lokalny"}, "correct": "A", "why": "Przy powtarzającym się początku wejścia (np. długim system promptcie) caching może obniżyć koszt ponownego przetwarzania input tokens.", "lesson": {"correct": "Czasem każdy request niesie ten sam długi system prompt. Bez cache model mógłby przetwarzać te same tokeny od nowa. Caching pozwala wykorzystać ponownie część pracy dla podobnego początku wejścia. Wtedy koszt input może być niższy. To nie magiczne usuwanie odpowiedzi. Typową pomyłką jest myślenie, że cache kasuje wszystkie output tokens.", "example": "Każde pytanie użytkownika ma z przodu 10 000 tokenów tych samych instrukcji. Cache pomaga nie płacić pełnej ceny za ponowne przetwarzanie tej stałej części przy każdym wywołaniu.", "remember": "Powtarzalny początek wejścia + caching = tańszy input.", "wrong": {"B": "Caching dotyczy głównie ponownego przetwarzania wejścia, nie zerowania odpowiedzi.", "C": "Caching nie powiększa limitu context window modelu.", "D": "Caching nie zamienia modelu chmurowego w darmowy lokalny."}}}, {"n": 10, "category": "LLM", "difficulty": "średnie", "text": "Jak tokenizer może potraktować rzadkie, złożone słowo w stylu „banoffee” wśród popularnych wyrazów?", "options": {"A": "Całe zdanie zawsze staje się jednym tokenem UNKNOWN", "B": "Rzadkie słowo jest usuwane z wejścia, a popularne są pomijane", "C": "Popularne słowa często zostają pojedynczymi tokenami, a rzadkie słowo może rozpaść się na mniejsze fragmenty", "D": "Każde słowo musi zostać rozbite dokładnie na pojedyncze litery"}, "correct": "C", "why": "Częste słowa często mają własne tokeny; rzadkie jak „banoffee” bywają dzielone na znane fragmenty.", "lesson": {"correct": "Tokenizer lubi częste kawałki tekstu. Popularne słowa często dostają własne tokeny. Rzadkie słowo może nie mieć jednego gotowego wpisu. Wtedy pada na części, np. „ban” i „offee”. Dzięki temu da się zapisać prawie dowolne słowo. Typową pomyłką jest wiara, że każde słowo zawsze = jeden token.", "example": "W zdaniu „I like banoffee pie” tokenizer może zostawić popularne słowa jako osobne tokeny, a „banoffee” pociąć na dwa fragmenty.", "remember": "Częste → często 1 token; rzadkie → często kilka fragmentów.", "wrong": {"A": "Zdanie nie staje się jednym UNKNOWN; jest dzielone na wiele tokenów.", "B": "Tekst nie jest usuwany — jest reprezentowany tokenami.", "D": "Rozbijanie na litery to skrajność; rzadkie słowa zwykle dzielą się na większe fragmenty."}}}, {"n": 11, "category": "LLM", "difficulty": "trudne", "text": "Dlaczego w modelach reasoningowych koszt odpowiedzi może być wyższy, niż sugeruje sama długość widocznego tekstu?", "options": {"A": "Bo reasoning zawsze jest darmowy i nie zużywa obliczeń", "B": "Bo dodatkowe tokeny wewnętrznego rozumowania mogą być rozliczane nawet wtedy, gdy użytkownik nie widzi całego procesu", "C": "Bo reasoning usuwa wszystkie input tokens z rachunku", "D": "Bo widoczna odpowiedź nigdy nie jest tokenizowana"}, "correct": "B", "why": "Reasoning zużywa obliczenia i może generować dodatkowe tokeny kosztowe nawet gdy proces nie jest w pełni widoczny.", "lesson": {"correct": "Model reasoningowy czasem „myśli” dłużej przed odpowiedzią. Ta dodatkowa praca też zużywa obliczenia. Nawet jeśli nie widzisz całego wewnętrznego procesu, może on wpływać na koszt. Widoczny tekst odpowiedzi to nie zawsze cały rachunek. Typową pomyłką jest liczenie kosztu tylko po długości finalnej odpowiedzi.", "example": "Widzisz krótką odpowiedź: „42”. W tle model mógł zużyć dużo tokenów na rozumowanie. Rachunek może być bliższy długiemu myśleniu niż tym dwóm znakom.", "remember": "Niewidoczne rozumowanie też może kosztować.", "wrong": {"A": "Reasoning właśnie wymaga obliczeń i może podnosić koszt.", "C": "Reasoning nie kasuje input tokens z rachunku.", "D": "Widoczna odpowiedź też jest tokenizowana i generowana."}}}, {"n": 12, "category": "LLM", "difficulty": "trudne", "text": "Dlaczego transformery okazały się przełomowe względem wcześniejszych sieci rekurencyjnych pod kątem skalowania?", "options": {"A": "Bo całkowicie zrezygnowały z tokenów", "B": "Bo działały wyłącznie znak po znaku bez uwagi", "C": "Bo wymagały zawsze mniejszej ilości danych niż LSTM", "D": "Bo lepiej umożliwiały równoległe przetwarzanie elementów sekwencji, m.in. dzięki attention"}, "correct": "D", "why": "Transformery dzięki attention mogą lepiej przetwarzać sekwencję równolegle, co ułatwia skalowanie na GPU.", "lesson": {"correct": "Transformer nie musi iść wyłącznie słowo po słowie jak klasyczne RNN/LSTM. Mechanizm uwagi pomaga ocenić, które fragmenty wejścia są ważne. Dzięki temu obliczenia da się lepiej zrównoleglić. To otworzyło drogę do większych modeli i większych danych. Typową pomyłką jest myślenie, że wygrał tylko „bo był mądrzejszy”, bez skalowalności.", "example": "Zamiast czekać na krok 9, by zacząć 10, wiele pozycji sekwencji może być analizowanych bardziej równolegle na GPU. Przy ogromnych zbiorach danych ta różnica staje się kluczowa.", "remember": "Przełom transformera to także skalowalność przez równoległość i attention.", "wrong": {"A": "Transformery nadal pracują na tokenach.", "B": "To bliższe ograniczeniom podejść sekwencyjnych; attention właśnie pomaga inaczej.", "C": "Przełom polegał na możliwości trenowania na większych danych, nie na mniejszym zapotrzebowaniu."}}}, {"n": 13, "category": "Agentic AI", "difficulty": "trudne", "text": "Dlaczego agent loops mogą zużywać znacznie więcej tokenów niż pojedynczy prosty prompt?", "options": {"A": "Bo agent może wielokrotnie wywoływać model i narzędzia w pętli — każdy krok to kolejne tokeny", "B": "Bo agent zawsze wykonuje dokładnie jedno wywołanie modelu", "C": "Bo pętla agenta kasuje historię i zwraca tokeny użytkownikowi", "D": "Bo narzędzia zastępują LLM i nigdy nie generują kolejnych wywołań"}, "correct": "A", "why": "Agent w pętli: LLM → tool → LLM → …; każde wywołanie dodaje tokeny, więc zużycie rośnie szybko.", "lesson": {"correct": "Prosty prompt to jedno wywołanie. Agent często działa w pętli: model myśli, wywołuje narzędzie, dostaje wynik, znów myśli. Każdy taki krok to nowe tokeny. Przy wielu krokach rachunek rośnie mocno. Dlatego przy agentach trzeba pilnować kosztu per workflow. Typową pomyłką jest porównywanie agenta do jednego taniego promptu.", "example": "Zadanie rezerwacji: wyszukaj → sprawdź termin → zarezerwuj → potwierdź. To może być kilka wywołań LLM plus wyniki narzędzi. Koszt jest bliższy sumie kroków niż jednemu zdaniu użytkownika.", "remember": "Agent loop = wiele kroków = wiele tokenów.", "wrong": {"B": "Właśnie wielokrotne wywołania są typowe dla agentów.", "C": "Pętla nie „zwraca tokenów”; zużywa je.", "D": "Narzędzia wspierają workflow, ale wyniki wracają do kolejnych wywołań modelu."}}}, {"n": 14, "category": "API", "difficulty": "średnie", "text": "Co umożliwia OpenAI Compatible Endpoint u innego dostawcy?", "options": {"A": "Trening własnego frontier modelu bez żadnego API", "B": "Całkowite pominięcie listy messages w każdym wywołaniu", "C": "Użycie tego samego wzorca klienta i struktury żądań po zmianie base_url oraz api_key", "D": "Automatyczne usunięcie potrzeby tokenizacji"}, "correct": "C", "why": "Kompatybilny endpoint pozwala użyć tego samego wzorca SDK/żądań po zmianie base_url i api_key.", "lesson": {"correct": "Chat Completions stało się de facto standardem. Inni dostawcy wystawiają podobne endpointy. Dzięki temu ten sam styl klienta działa z wieloma backendami. Zmieniasz adres i klucz, a struktura messages zostaje. Typową pomyłką jest myślenie, że klasa OpenAI zawsze oznacza wyłącznie chmurę OpenAI.", "example": "Ustawiasz base_url Gemini albo localhost Ollamy i ten sam chat.completions.create(). Kod parsujący odpowiedź wygląda podobnie.", "remember": "Compatible endpoint = ten sam wzorzec API, inny backend.", "wrong": {"A": "Compatible endpoint to sposób wywołania istniejącego API, nie trening frontier od zera.", "B": "Lista messages nadal jest kluczowa.", "D": "Tokenizacja nadal jest częścią działania modelu."}}}, {"n": 15, "category": "LLM", "difficulty": "średnie", "text": "Dlaczego duży context window nie oznacza, że zawsze warto wypełniać je maksymalnie danymi?", "options": {"A": "Bo większy input zawsze poprawia jakość bez żadnych wad", "B": "Bo modele z dużym oknem nie przyjmują system promptu", "C": "Bo output tokens przestają istnieć przy dużym oknie", "D": "Bo większy input podnosi koszt, obliczenia, opóźnienie i może dokładać nieistotne informacje"}, "correct": "D", "why": "Duże okno daje możliwość, nie obowiązek; maksymalny input zwiększa koszt, latency i szum informacyjny.", "lesson": {"correct": "Duże okno kontekstowe jest potężne. Nie znaczy to jednak „wrzuć wszystko, co masz”. Więcej wejścia to zwykle więcej kosztów i obliczeń. Może też spowolnić odpowiedź. Nieistotne dane mogą przeszkadzać. Lepiej podawać to, co naprawdę potrzebne. Typową pomyłką jest myślenie, że pełny limit zawsze = lepsza odpowiedź.", "example": "Model ma limit miliona tokenów. Twoje zadanie wymaga trzech stron dokumentacji. Wysłanie całej biblioteki książek tylko dlatego, że „się zmieści”, podniesie koszt i może rozproszyć model.", "remember": "Duże okno = możliwość; rozsądny kontekst = obowiązek inżyniera.", "wrong": {"A": "Większy input ma wady: koszt, latency, szum.", "B": "Duże okno nie wyłącza system promptu.", "C": "Output tokens nadal istnieją niezależnie od rozmiaru okna."}}}, {"n": 16, "category": "Narzędzia", "difficulty": "łatwe", "text": "Do czego służy encode w bibliotece tiktoken?", "options": {"A": "Do zamiany tekstu na listę identyfikatorów tokenów", "B": "Do trenowania frontier modelu od zera", "C": "Do zwiększenia limitu context window o stałą wartość", "D": "Do wysyłania żądania Chat Completions bez HTTP"}, "correct": "A", "why": "encode zamienia tekst na listę ID tokenów — reprezentację, którą „widzi” model.", "lesson": {"correct": "Model nie czyta liter jak człowiek. Najpierw tekst staje się tokenami z numerami. encode robi właśnie to: tekst → lista ID. Potem możesz decode, żeby zobaczyć kawałki tekstu. To ćwiczenie buduje intuicję o koszcie i kontekście. Typową pomyłką jest mylenie encode z wywołaniem API modelu.", "example": "encode(\"Hi my name is Ed...\") zwraca listę liczb. Każda liczba to jeden token. Potem decode([id]) pokazuje np. „ and” ze spacją.", "remember": "encode: tekst → ID tokenów.", "wrong": {"B": "tiktoken nie trenuje frontier modelu; tylko tokenizuje.", "C": "encode nie powiększa limitu kontekstu.", "D": "encode nie wysyła Chat Completions."}}}, {"n": 17, "category": "API", "difficulty": "średnie", "text": "W jakiej postaci dostawcy zwykle podają ceny tokenów?", "options": {"A": "Wyłącznie jako stały abonament za jednego użytkownika bez tokenów", "B": "Jako kwoty za milion input tokens i osobno za milion output tokens", "C": "Wyłącznie jako cena za jeden znak Unicode", "D": "Jako darmowy limit bez żadnego cennika tokenów"}, "correct": "B", "why": "Ceny zwykle są podawane jako $X za 1 mln input tokens i $Y za 1 mln output tokens.", "lesson": {"correct": "Pojedynczy token jest bardzo tani, więc cennik pokazuje większą skalę. Zwykle widzisz cenę za milion tokenów wejścia i osobno za milion wyjścia. Input i output mogą mieć różne stawki. To ułatwia porównywanie modeli. Typową pomyłką jest szukanie ceny „za jeden znak” jako jedynej formy.", "example": "Model A: 0,50 USD za 1M input i 1,50 USD za 1M output. Model B ma inne stawki. Porównujesz obie kolumny, nie tylko jakość odpowiedzi.", "remember": "Cennik API: zwykle za 1M input i 1M output osobno.", "wrong": {"A": "API często jest pay per use, nie tylko abonamentem bez tokenów.", "C": "Standardem są tokeny, zwykle w skali miliona, nie sam znak Unicode.", "D": "Dostawcy pokazują cenniki tokenów; to klucz do wyboru modelu."}}}, {"n": 18, "category": "LLM", "difficulty": "trudne", "text": "Które zdanie najtrafniej odróżnia RAG od uczenia parametrów?", "options": {"A": "RAG zmienia wagi modelu przy każdym pobranym dokumencie", "B": "RAG zastępuje LLM wyszukiwarką i nie generuje odpowiedzi", "C": "RAG dostarcza informacje w kontekście bez konieczności zapisywania ich w wagach", "D": "RAG zwiększa liczbę aktywnych ekspertów w MoE"}, "correct": "C", "why": "RAG podaje informacje w kontekście; nie musi ich zapisywać w wagach modelu.", "lesson": {"correct": "RAG najpierw wyszukuje potrzebne treści. Potem dokłada je do promptu. Model odpowiada na podstawie pytania i znalezionych fragmentów. Dokument nie musi trafiać do wag. To ściąga na biurko, nie przepisanie podręcznika do pamięci modelu. Typową pomyłką jest mylenie chwilowego kontekstu z treningiem.", "example": "Pytasz o dzisiejszy regulamin. System znajduje fragment i dokłada go do wejścia. Model korzysta z niego teraz. Po wywołaniu regulamin nie staje się trwałym parametrem.", "remember": "RAG = informacje w kontekście, nie automatyczny zapis do wag.", "wrong": {"A": "Pobrany dokument trafia do kontekstu, nie automatycznie do wag.", "B": "Wyszukiwarka dostarcza materiał, ale LLM nadal generuje odpowiedź.", "D": "RAG nie steruje ekspertami MoE."}}}, {"n": 19, "category": "LLM", "difficulty": "trudne", "text": "Które podejścia pomagają świadomie zarządzać rozmiarem kontekstu w aplikacji LLM?", "options": {"A": "Wysyłanie zawsze maksymalnej liczby tokenów bez selekcji", "B": "Usuwanie system promptu i wyłączanie historii na stałe bez potrzeby", "C": "Zastąpienie modelu wyłącznie rankingiem leaderboard bez architektury", "D": "Przycinanie historii, streszczanie starszych wiadomości, selekcja dokumentów RAG i caching"}, "correct": "D", "why": "Zarządzanie kontekstem obejmuje m.in. przycinanie historii, streszczanie, wybór dokumentów RAG i caching.", "lesson": {"correct": "Context window to ograniczenie architektury. Nie wystarczy mieć duży model. Trzeba zarządzać wejściem. Możesz skracać starą historię, streszczać dawne tury, wybierać tylko ważne dokumenty i cache’ować powtarzalne części. Dzięki temu kontrolujesz koszt i jakość. Typową pomyłką jest wrzucanie wszystkiego „na zapas”.", "example": "Po 40 turach rozmowy nie wysyłasz wszystkich 40 w całości. Streszczasz początek, zostawiasz ostatnie ważne wiadomości, dokładasz tylko 2 najlepsze fragmenty RAG i cache’ujesz stały system prompt.", "remember": "Zarządzaj kontekstem: tnij, streszczaj, wybieraj, cache’uj.", "wrong": {"A": "Maksymalne wypełnianie okna podnosi koszt i szum.", "B": "Czasem skraca się historię, ale nie chodzi o bezmyślne usuwanie wszystkiego zawsze.", "C": "Leaderboard pomaga wybrać model, ale nie zastępuje zarządzania kontekstem."}}}, {"n": 20, "category": "API", "difficulty": "trudne", "text": "Co oznacza, że pojedyncze wywołanie LLM przez API jest bezstanowe (stateless)?", "options": {"A": "Model automatycznie zapisuje każdą rozmowę w swoich wagach", "B": "Model nie pamięta poprzedniego niezależnego wywołania — dostaje tylko to, co jest w aktualnym wejściu", "C": "Klient HTTP musi być tworzony od nowa przy każdej literze odpowiedzi", "D": "Tokenizacja działa wyłącznie przy pierwszym wywołaniu w sesji"}, "correct": "B", "why": "Bezstanowość oznacza, że między niezależnymi wywołaniami API nie ma automatycznej pamięci — model widzi tylko aktualne wejście.", "lesson": {"correct": "Wyobraź sobie, że każde wywołanie API to nowa rozmowa z kimś, kto właśnie wszedł do pokoju. Nie pamięta, co mówiono minutę temu w innym wywołaniu. Dostaje tylko kartkę, którą mu właśnie podajesz. Jeśli na kartce nie ma historii, nie ma też „pamięci”. Dlatego inżynier musi sam budować kontekst. Typową pomyłką jest myślenie, że model sam trzyma czat między requestami.", "example": "Najpierw wysyłasz: „Nazywam się Ed”. Potem w zupełnie nowym wywołaniu pytasz tylko: „Jak mam na imię?”. Model nie zna odpowiedzi, bo w nowym wejściu nie ma imienia.", "remember": "Nowe wywołanie = nowa kartka. Nie ma automatycznej pamięci między requestami.", "wrong": {"A": "Zwykłe wywołanie inference nie dopisuje rozmowy do wag modelu.", "C": "Klienta można używać wielokrotnie. Problem nie leży w tworzeniu obiektu przy każdej literze.", "D": "Tokenizacja działa przy każdym wejściu tekstowym."}}}];
const quiz=document.querySelector("#quiz");
const letters=["A","B","C","D"];
const escapeHtml=value=>value.replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
questions.forEach(question=>{
const article=document.createElement("article");
article.className="question";
article.id=`question-${question.n}`;
const options=letters.map(letter=>`<label class="option"><input type="radio" name="q${question.n}" value="${letter}"><strong>${letter}.</strong><span>${escapeHtml(question.options[letter])}</span></label>`).join("");
article.innerHTML=`<div class="meta"><span class="tag">${escapeHtml(question.category)}</span><span class="tag difficulty">${escapeHtml(question.difficulty)}</span></div><h2>${question.n}. ${escapeHtml(question.text)}</h2><div class="options">${options}<label class="option unknown"><input type="radio" name="q${question.n}" value="?"><strong>?</strong><span>Nie mam pojęcia — bez zgadywania, chcę się nauczyć</span></label></div><label class="confidence">Pewność: <select name="confidence${question.n}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><div class="feedback" aria-live="polite"></div>`;
quiz.appendChild(article);
});
let lastResults=null;
const selectedAnswer=n=>document.querySelector(`input[name="q${n}"]:checked`)?.value||"";
const confidence=n=>document.querySelector(`select[name="confidence${n}"]`).value;
const lessonBlock=(question,chosen)=>{
const wrong=chosen==="?"?"":`<div class="lesson-part"><strong>Twoja odpowiedź</strong>${escapeHtml(question.lesson.wrong[chosen])}</div>`;
const intro=chosen==="?"?"<p>Bez zgadywania — oto spokojne wyjaśnienie.</p>":"";
return `${intro}${wrong}<div class="lesson-part"><strong>Poprawna myśl</strong>${escapeHtml(question.lesson.correct)}</div><div class="lesson-part"><strong>Przykład</strong>${escapeHtml(question.lesson.example)}</div><div class="lesson-part"><strong>Zapamiętaj</strong>${escapeHtml(question.lesson.remember)}</div>`;
};
document.querySelector("#check").addEventListener("click",()=>{
const missing=questions.filter(question=>!selectedAnswer(question.n));
document.querySelectorAll(".question").forEach(element=>element.classList.remove("missing"));
if(missing.length){
missing.forEach(question=>document.querySelector(`#question-${question.n}`).classList.add("missing"));
document.querySelector(`#question-${missing[0].n}`).scrollIntoView({behavior:"smooth",block:"center"});
alert(`Uzupełnij odpowiedź A–D albo „Nie mam pojęcia” w ${missing.length} pytaniach.`);
return;
}
let score=0;
let unknown=0;
lastResults=questions.map(question=>{
const chosen=selectedAnswer(question.n);
const feedback=document.querySelector(`#question-${question.n} .feedback`);
feedback.className="feedback show";
if(chosen===question.correct){
score++;
feedback.classList.add("ok");
feedback.innerHTML=`<h3>OK · ${question.correct}</h3><p>${escapeHtml(question.why)}</p>`;
return{question,chosen,status:"OK",confidence:confidence(question.n)};
}
if(chosen==="?"){
unknown++;
feedback.classList.add("learn");
feedback.innerHTML=`<h3>NIE WIEM · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"NIE WIEM",confidence:confidence(question.n)};
}
feedback.classList.add("bad");
feedback.innerHTML=`<h3>BŁĄD · Twoja: ${chosen} · Poprawna: ${question.correct}</h3>${lessonBlock(question,chosen)}`;
return{question,chosen,status:"BŁĄD",confidence:confidence(question.n)};
});
const percent=Math.round(score/questions.length*100);
const summary=document.querySelector("#summary");
summary.className="show";
summary.innerHTML=`<strong>Wynik: ${score}/20 · ${percent}%</strong><br>Nie wiem: ${unknown}<p class="small">Przeczytaj krótkie wyjaśnienia oraz mini-lekcje pod pytaniami oznaczonymi BŁĄD lub NIE WIEM.</p>`;
document.querySelector("#downloadResults").disabled=false;
summary.scrollIntoView({behavior:"smooth",block:"start"});
});
const tableRow=result=>`| ${result.question.n} | ${result.chosen||""} | ${result.confidence||""} |  |`;
const download=(filename,content)=>{
const blob=new Blob([content],{type:"text/markdown;charset=utf-8"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download=filename;
link.click();
URL.revokeObjectURL(link.href);
};
document.querySelector("#downloadAnswers").addEventListener("click",()=>{
const rows=questions.map(question=>tableRow({question,chosen:selectedAnswer(question.n),confidence:confidence(question.n)})).join("\n");
download("02.10.2026_my_answers.md",`# Moje odpowiedzi – 02.10.2026\n\n| # | Twoja odpowiedź (A/B/C/D/?) | Pewność (1-5) | Uwagi |\n|---:|:---:|:---:|---|\n${rows}\n\n## Notatki\n`);
});
document.querySelector("#downloadResults").addEventListener("click",()=>{
if(!lastResults)return;
const score=lastResults.filter(result=>result.status==="OK").length;
const unknown=lastResults.filter(result=>result.status==="NIE WIEM").length;
const percent=Math.round(score/questions.length*100);
const detail=lastResults.map(result=>`| ${result.question.n} | ${result.chosen} | ${result.question.correct} | ${result.status} | ${result.confidence||""} | ${result.question.why.replace(/\|/g,"\\|")} |`).join("\n");
const strong=[...new Set(lastResults.filter(result=>result.status==="OK").map(result=>result.question.category))];
const repeat=[...new Set(lastResults.filter(result=>result.status!=="OK").map(result=>result.question.category))];
const strongText=strong.length?strong.map(value=>`- ${value}`).join("\n"):"- Brak kategorii z poprawną odpowiedzią.";
const repeatText=repeat.length?repeat.map(value=>`- ${value}`).join("\n"):"- Brak — świetna robota.";
download("02.10.2026_results.md",`# Wynik quizu — 02.10.2026\n\n## Wynik\n\n- ${score}/20\n- ${percent}%\n- Nie wiem: ${unknown}\n\n## Szczegóły\n\n| # | Twoja odpowiedź | Poprawna odpowiedź | Wynik | Pewność | Komentarz |\n|---:|:---:|:---:|:---:|:---:|---|\n${detail}\n\n## Mocne strony\n\n${strongText}\n\n## Obszary do powtórki\n\n${repeatText}\n`);
});
</script>
</body>
</html>
